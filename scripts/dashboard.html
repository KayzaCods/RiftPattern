}

// Progreso conductual (#10): serie de la proporcion de muertes overextension-
// with-lead con banda IC de Wilson, linea de meta y veredicto por bloques.
// La banda existe para NO celebrar ruido: cada ventana tiene 4-5 incidentes.
function ProgressCard({prog}){
  if(!prog || !prog.series || !prog.series.length) return null;
  const s = prog.series;
  const W = 640, H = 120, PAD = 4;
  const maxY = Math.max(prog.goal_prop*1.5, ...s.map(p=>p.ci_high||0)) * 1.05;
  const x = i => PAD + i*(W-2*PAD)/Math.max(1, s.length-1);
  const y = v => H - PAD - (v/maxY)*(H-2*PAD);
  const line = s.map((p,i)=>`${x(i).toFixed(1)},${y(p.prop||0).toFixed(1)}`).join(" ");
  const band = s.map((p,i)=>`${x(i).toFixed(1)},${y(p.ci_high||0).toFixed(1)}`).join(" ")
    + " " + [...s].reverse().map((p,i)=>`${x(s.length-1-i).toFixed(1)},${y(p.ci_low||0).toFixed(1)}`).join(" ");
  const l = prog.latest, b = prog.blocks;
  const pct = v => v==null ? "—" : (v*100).toFixed(1)+"%";
  let verdict = null;
  if(b && b.prev.prop!=null && b.last.prop!=null){
    if(b.last.ci_high < b.prev.ci_low) verdict = {txt:"mejora clara (IC separados)", color:"var(--signal-ok)"};
    else if(b.last.ci_low > b.prev.ci_high) verdict = {txt:"empeoramiento (IC separados)", color:"var(--color-text-danger)"};
    else verdict = {txt:"IC solapados: sin cambio distinguible todavía", color:"var(--color-text-tertiary)"};
  }
  return h("div", {style:{border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",padding:"14px 16px",marginBottom:16}},
    h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",flexWrap:"wrap",gap:8}},
      h("div", null,
        h("div", {style:{fontSize:13,fontWeight:600}}, "Progreso — sobreextensión con ventaja"),
        h("div", {style:{fontSize:11,color:"var(--color-text-tertiary)",marginTop:2}},
          `muertes ${prog.classes.join("/")} con power_index > ${prog.lead_power_index} · ventana móvil de ${prog.window} partidas · ${prog.note}`)
      ),
      h("div", {style:{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",textAlign:"right"}},
        `última ventana: ${l.incidents}/${l.deaths} muertes · ${l.rate_per_game}/partida · ${pct(l.prop)} IC [${pct(l.ci_low)}–${pct(l.ci_high)}]`,
        h("br"), `densidad ${l.deaths_per_game} muertes/partida (a la baja = posible sobre-corrección)`)
    ),
    h("svg", {viewBox:`0 0 ${W} ${H}`, style:{width:"100%",height:120,marginTop:10,display:"block"}},
      h("polygon", {points:band, fill:"color-mix(in oklab,var(--signal-bad) 14%,transparent)"}),
      h("line", {x1:PAD, x2:W-PAD, y1:y(prog.goal_prop), y2:y(prog.goal_prop),
                 stroke:"var(--signal-ok)", strokeWidth:1, strokeDasharray:"4 3"}),
      h("polyline", {points:line, fill:"none", stroke:"var(--signal-bad)", strokeWidth:1.5})
    ),
    h("div", {style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}},
      h("span", null, s[0].date),
      h("span", null, `meta ${pct(prog.goal_prop)} (1 incidente por 20 muertes)`),
      h("span", null, s[s.length-1].date)
    ),
    verdict && h("div", {style:{fontSize:12,marginTop:8,color:verdict.color}},
      `Bloques de ${b.block}: ${pct(b.prev.prop)} [${pct(b.prev.ci_low)}–${pct(b.prev.ci_high)}] → `
      + `${pct(b.last.prop)} [${pct(b.last.ci_low)}–${pct(b.last.ci_high)}] — ${verdict.txt}`)
  );
}

const DASH_VIEW_STATE = "lolcoach.dashboard.view.v1";
// Vistas validas para el deep-link ?tab=; cualquier otro valor se ignora.
const TAB_KEYS = ["session","trades","anchors","decisions","patterns","calibrate","review"];
function readViewState(){
  try { const raw=sessionStorage.getItem(DASH_VIEW_STATE); const v=raw&&JSON.parse(raw); return v&&typeof v==="object" ? v : {}; }
  catch(_) { return {}; }
}
function App(){
  const restoredView = useRef(readViewState()).current;
  const requestedMatch = useRef(new URLSearchParams(location.search).get("match")).current;
  // ?tab= completa la familia de deep-links que ya existe (?dec=, ?match=): deja
  // enlazar una vista concreta sin depender del estado guardado en sessionStorage.
  const requestedTab = useRef((()=>{ const t=new URLSearchParams(location.search).get("tab");
    return TAB_KEYS.includes(t) ? t : null; })()).current;
  const [stats, setStats] = useState(null);
  const [decisions, setDecisions] = useState([]);
  const [patterns, setPatterns] = useState([]);
  const [err, setErr] = useState(null);
  const [loading, setLoading] = useState(true);

  const [tab, setTab] = useState(requestedTab || (requestedMatch ? "decisions" : (restoredView.tab||"decisions")));
  const [acc, setAcc] = useState(restoredView.acc||"both");
  const [fdet, setFdet] = useState(restoredView.fdet||"all");
  const [fbFilter, setFbFilter] = useState(restoredView.fbFilter||"all");   // all | disagree | agree | none
  const [sort, setSort] = useState(restoredView.sort||"recent");
  // Entrada por partidas: se reconoce una partida antes de ver decisiones
  // sueltas. "Todas las decisiones" queda como vista secundaria con sus
  // filtros intactos, que es donde vive la busqueda transversal.
  const [decView, setDecView] = useState(restoredView.decView==="all" ? "all" : "matches");
  const [matchLimit, setMatchLimit] = useState(20);
  const [limit, setLimit] = useState(Number.isFinite(restoredView.limit)?restoredView.limit:50);
  const skipInitialLimitReset = useRef(true);
  // Ancla de scroll del acordeon. Se apunta la fila pulsada y su posicion en
  // pantalla ANTES de cambiar el estado; el useLayoutEffect de abajo compensa
  // tras el commit. Se usa useLayoutEffect y no requestAnimationFrame porque
  // con React 18 el re-render puede caer despues de dos frames: medido, la fila
  // seguia saltando 1412 px con rAF doble.
  const scrollAnchor = useRef(null);
  const anchorExp = (domId, mutate) => {
    const el = document.getElementById(domId);
    scrollAnchor.current = el ? {domId, top: el.getBoundingClientRect().top} : null;
    mutate();
  };
  React.useLayoutEffect(() => {
    const a = scrollAnchor.current;
    if(!a) return;
    scrollAnchor.current = null;
    const el = document.getElementById(a.domId);
    if(!el) return;
    const delta = el.getBoundingClientRect().top - a.top;
    if(Math.abs(delta) > 1) window.scrollBy(0, delta);
  });
  const [exp, setExp] = useState(null);
  const [clipOpen, setClipOpen] = useState(null);
  const [fbs, setFbs] = useState({});
  const fbsRef = useRef({});
  const fbQueues = useRef({});
  const [matches, setMatches] = useState([]);
  const [selMatch, setSelMatch] = useState(requestedMatch || restoredView.selMatch||null);   // null = todas las partidas
  const [mapData, setMapData] = useState(null);
  const [vizMode, setVizMode] = useState("map");

  useEffect(() => { fbsRef.current = fbs; }, [fbs]);
  const [replay, setReplay] = useState(null);       // {available, in_match_start_s} del replay completo
  const replayRef = useRef(null);
  // Momento (game_time_ms) al que buscar el replay tras un salto: el video de la
  // partida carga async, asi que el seek queda pendiente hasta tener metadata.
  // Sin esto, saltar desde Exposicion/colas dejaba el video en 0:00 y habia que
  // buscar el frame a mano (feedback 2026-07-18).
  const [pendingSeek, setPendingSeek] = useState(null);
  const [focusViz, setFocusViz] = useState(null);   // decision id focused (hover) in the map/timeline
  const [vizOpen, setVizOpen] = useState(null);     // decision expanded INLINE under the map/timeline
  const [queue, setQueue] = useState(null);         // cola de revisión (/api/review_queue)
  const [ingest, setIngest] = useState(null);       // salud del pipeline (/api/ingest_status, banner de key muerta)
  const [progress, setProgress] = useState(null);   // progreso conductual (#10, bloque progress de /api/patterns)
  const [exposureData, setExposureData] = useState(null);   // Exposicion (#17 Fase 1, /api/exposure)
  const [anchorData, setAnchorData] = useState(null);       // Anchor set (#17, /api/anchor_set)
  const loadAnchors = () => fetch("/api/anchor_set").then(r=>r.json()).then(setAnchorData).catch(()=>{});
  // Etiquetar es optimista: la fila se pinta al instante y el POST persiste por
  // clave estable (sobrevive re-analisis). Sin recarga: la lista no debe saltar.
  const setAnchorLabel = (id, label) => {
    setAnchorData(d => d && ({...d,
      moments: d.moments.map(x => x.id===id ? {...x, anchor_label: label} : x),
      n_marked: d.moments.filter(x => x.id===id ? label : x.anchor_label).length}));
    fetch("/api/anchor",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id, label})}).catch(()=>{});
  };
  const [sessionData, setSessionData] = useState(null);  // Sesion de hoy (#16, /api/session)
  const [sessionDone, setSessionDone] = useState({});     // ids completados en la tanda actual (vive en App: sobrevive cambios de pestana)
  const sessionSeen = useRef(new Set());                  // ids mostrados en la tanda (incluye los ya dropeados) para no repetirlos al reemplazar
  const loadSession = () => fetch("/api/session").then(r=>r.json()).then(d => {
    sessionSeen.current = new Set((d.moments||[]).map(m=>m.id));
    setSessionData(d);
  }).catch(()=>{});
  // "Traer nuevas": reemplaza SOLO las completadas por momentos nuevos y deja las
  // que aun no marcaste (la lista no crece). Excluye todo lo ya visto en la tanda
  // —incluido lo que ya salio de pantalla— porque el server no basta: "guardar
  // contexto" (nota sin best_option) no marca la decision y volveria a proponerla.
  const loadMoreSession = () => {
    const cur = (sessionData && sessionData.moments) || [];
    const keep = cur.filter(m => !(sessionDone[m.id] || fbs[m.id]));  // sin marcar: se quedan
    const need = cur.length - keep.length;                            // cuantas completaste = cuantas reemplazar
    if(need <= 0) return;
    const exclude = [...sessionSeen.current];
    fetch("/api/session" + (exclude.length ? "?exclude="+exclude.join(",") : ""))
      .then(r=>r.json())
      .then(d => {
        const fresh = (d.moments||[]).filter(m=>!sessionSeen.current.has(m.id)).slice(0, need);
        fresh.forEach(m => sessionSeen.current.add(m.id));
        setSessionData({...d, moments: [...keep, ...fresh], exhausted: fresh.length===0});
      }).catch(()=>{});
  };
  const [tradeData, setTradeData] = useState(null);       // Cola de trades (#5, /api/trade_queue)
  const [tradeDone, setTradeDone] = useState({});         // ids marcados en la tanda actual (verde hasta "Actualizar cola")
  const loadTrade = () => fetch("/api/trade_queue").then(r=>r.json()).then(setTradeData).catch(()=>{});
  const refreshTrade = () => { setTradeDone({}); loadTrade(); };  // el server ya excluye las marcadas
  const [jumpId, setJumpId] = useState(null);       // decisión destino de un salto (scroll + resaltado)
  const jumpRef = useRef(Boolean(restoredView.selMatch)); // conserva la partida restaurada durante el primer efecto de cohort
  const loadQueue = () => fetch("/api/review_queue").then(r=>r.json()).then(setQueue).catch(()=>{});

  // Salto directo a una decisión: selecciona cohort/partida, expande la card y
  // hace scroll. Lo usan la cola de revisión y el deep-link ?dec=ID (los ids
  // del informe de triaje se vuelven clicables/pegables).
  const jumpTo = (t) => {
    const targetAcc = t.cohort==="challenger" ? "challenger" : "both";
    setTab("decisions");
    setAcc(prev => { if(prev!==targetAcc) jumpRef.current = true; return targetAcc; });
    setFdet("all"); setFbFilter("all"); setSort("recent");
    setSelMatch(t.match); setExp(t.id); setClipOpen(null); setLimit(500); setJumpId(t.id);
    setPendingSeek(t.t_ms!=null ? t.t_ms : null);   // con momento: el replay busca ahi solo
  };

  useEffect(() => {
    Promise.all([
      fetch("/api/stats").then(r=>r.json()),
      fetch("/api/decisions").then(r=>r.json()),
      fetch("/api/matches").then(r=>r.json()),
    ]).then(([s,d,m]) => {
      setStats(s); setDecisions(d); setMatches(m);
      const initialMatch = requestedMatch || restoredView.selMatch;
      if(initialMatch && m.some(x=>x.match_id===initialMatch)) {
        setSelMatch(initialMatch);
        if(requestedMatch) setTab("decisions");
      } else if(initialMatch) setSelMatch(null);
      const init = {}; d.forEach(x => { if(x.feedback) init[x.id]=x.feedback; });
      setFbs(init); setLoading(false);
      const qdec = parseInt(new URLSearchParams(location.search).get("dec"), 10);
      if(qdec){ const t = d.find(x=>x.id===qdec); if(t) jumpTo({id:t.id, match:t.match, cohort:t.cohort}); }
    }).catch(e => { setErr(String(e)); setLoading(false); });
    loadQueue();
    loadSession();
    loadTrade();
    loadAnchors();
    fetch("/api/ingest_status").then(r=>r.json()).then(setIngest).catch(()=>{});
  }, []);

  // Solo preferencias de vista efímeras: nunca cuenta, Riot ID ni texto privado.
  useEffect(() => {
    try { sessionStorage.setItem(DASH_VIEW_STATE, JSON.stringify({tab,acc,fdet,fbFilter,sort,limit,selMatch,decView})); }
    catch(_) {}
  }, [tab,acc,fdet,fbFilter,sort,limit,selMatch]);
  useEffect(() => {
    if(loading || restoredView.scrollY==null) return;
    const restore=()=>window.scrollTo(0, Math.max(0, restoredView.scrollY));
    requestAnimationFrame(restore); const t=setTimeout(restore, 180);
    return ()=>clearTimeout(t);
  }, [loading]);
  useEffect(() => {
    const remember=()=>{ try { const current=readViewState(); sessionStorage.setItem(DASH_VIEW_STATE, JSON.stringify({...current,scrollY:window.scrollY})); } catch(_) {} };
    window.addEventListener("pagehide",remember); return ()=>window.removeEventListener("pagehide",remember);
  }, []);

  useEffect(() => {
    if(jumpRef.current){ jumpRef.current = false; }   // salto en curso: no resetear la partida elegida
    else { setSelMatch(null); }
    fetch("/api/patterns?cohort="+acc).then(r=>r.json())
      .then(d => { setPatterns(d.patterns||[]); setProgress(d.progress||null); }).catch(()=>{});
    fetch("/api/exposure?cohort="+acc).then(r=>r.json()).then(setExposureData).catch(()=>{});
  }, [acc]);

  // Tras un salto, espera a que la card exista en el DOM y haz scroll hasta ella.
  // Re-scroll a los 900ms: el mapa/replay cargan despues y desplazan el layout,
  // dejando el primer scroll corto (feedback del jugador).
  useEffect(() => {
    if(!jumpId) return;
    const el = document.getElementById("dec-"+jumpId);
    if(el){
      el.scrollIntoView({behavior:"smooth", block:"center"});
      const t2 = setTimeout(()=>{
        const el2 = document.getElementById("dec-"+jumpId);
        if(el2) el2.scrollIntoView({behavior:"smooth", block:"center"});
      }, 900);
      const t = setTimeout(()=>setJumpId(null), 2600);
      return ()=>{ clearTimeout(t); clearTimeout(t2); };
    }
  }, [jumpId, selMatch, decisions, limit, tab]);

  useEffect(() => {
    if(skipInitialLimitReset.current){ skipInitialLimitReset.current=false; return; }
    setLimit(50);
  }, [acc, fdet, sort, selMatch]);

  // Cambiar de cuenta cambia el conjunto de partidas: el "mostrar 20 mas"
  // acumulado no tiene sentido sobre una lista distinta.
  useEffect(() => { setMatchLimit(20); }, [acc]);

  useEffect(() => {
    setFocusViz(null);
    if(!selMatch){ setMapData(null); setReplay(null); return; }
    let a = true; setMapData(null); setReplay(null);
    fetch("/api/match_map?match=" + encodeURIComponent(selMatch))
      .then(r => r.json()).then(d => { if(a) setMapData(d); }).catch(()=>{});
    fetch("/api/match_replay?match=" + encodeURIComponent(selMatch))
      .then(r => r.json()).then(d => { if(a && d.available) setReplay(d); }).catch(()=>{});
    return () => { a = false; };
  }, [selMatch]);

  // Seek the match replay to a game moment (timeline/map marker click). The full
  // Ascent recording starts at in_match_start_s (0 for ascent_full), so
  // video time = game_time - start. Lands 5s early for context.
  const seekReplay = (t_ms) => {
    const v = replayRef.current;
    if(!v || !replay) return;
    const t = Math.max(0, t_ms/1000 - (replay.in_match_start_s||0) - 5);
    try { v.currentTime = t; v.play && v.play().catch(()=>{}); } catch(_){}
  };
  const selectViz = (id) => {
    setVizOpen(id);
    const d = decisions.find(x=>x.id===id);
    if(d) seekReplay(d.moment_ms!=null ? d.moment_ms : d.game_time_ms);
  };
  // Consume el seek pendiente de un salto en cuanto el video tiene metadata
  // (readyState>=1); si aun no la tiene, lo recoge onLoadedMetadata del video.
  useEffect(() => {
    if(pendingSeek==null) return;
    const v = replayRef.current;
    if(v && replay && v.readyState >= 1){ seekReplay(pendingSeek); setPendingSeek(null); }
  }, [pendingSeek, replay]);

  const openDec = (id) => { setExp(id); setClipOpen(null); setLimit(l=>Math.max(l,500)); };

  const setFb = (id,v) => {
    // Una decisión puede aparecer a la vez en mapa y lista. Serializar por id
    // evita que una respuesta vieja revierta un veredicto posterior correcto.
    const previous = fbQueues.current[id] || Promise.resolve(true);
    const queued = previous.catch(()=>false).then(async()=>{
      const prior = fbsRef.current[id];
      const next = prior===v ? null : v;
      const optimistic = {...fbsRef.current,[id]:next};
      fbsRef.current = optimistic; setFbs(optimistic);
      try {
        const r = await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,feedback:next})});
        if(!r.ok) throw new Error("feedback");
        return true;
      } catch(_) {
        const rollback = {...fbsRef.current,[id]:prior};
        fbsRef.current = rollback; setFbs(rollback);
        return false;
      }
    });
    fbQueues.current[id] = queued;
    return queued;
  };
  const saveContext = (id, payload) => {
    return fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id, ...payload})}).then(r=>{
        if(!r.ok) throw new Error("context");
    // Refleja el guardado en memoria: la card se desmonta al colapsar y al
    // reabrir se reinicializa desde estos objetos — sin este patch la nota
    // "desaparecia" de la UI aunque SI estaba en la DB (feedback 2026-07-18).
    const patch = {};
    if("note" in payload) patch.feedback_note = payload.note;
    if("best_option" in payload) patch.best_option = payload.best_option;
    if("mark_type" in payload) patch.mark_type = payload.mark_type;
    setDecisions(ds => ds.map(x => x.id===id ? {...x, ...patch} : x));
    setTradeData(td => (td && td.moments)
      ? {...td, moments: td.moments.map(x => x.id===id ? {...x, ...patch} : x)} : td);
    return true;
    }).catch(()=>false);
  };
  // Handlers de la Sesion de hoy: igual que los normales pero dejan el momento
  // como "completada" (la confirmacion no se pierde hasta pedir tanda nueva).
  const sessionFb = async (id, v) => { const ok=await setFb(id, v); if(ok) setSessionDone(s=>({...s,[id]:true})); return ok; };
  const sessionSave = async (id, payload) => { const ok=await saveContext(id, payload); if(ok) setSessionDone(s=>({...s,[id]:true})); return ok; };
  const newSession = () => { setSessionDone({}); loadSession(); };
  // Handlers de la Cola de trades (#5): marcar deja el trade en verde en la tanda.
  const tradeFb = async (id, v) => { const ok=await setFb(id, v); if(ok) setTradeDone(s=>({...s,[id]:true})); return ok; };
  const tradeSave = async (id, payload) => { const ok=await saveContext(id, payload); if(ok) setTradeDone(s=>({...s,[id]:true})); return ok; };
  const toggleClip = (id) => setClipOpen(c => c===id ? null : id);

  // "both" = MIS cuentas: los cohorts de referencia (challenger) solo se ven al elegir su chip.
  const inCohort = d => acc==="both" ? d.cohort!=="challenger" : d.cohort===acc;
  const fbBase = decisions.filter(d => inCohort(d) && (fdet==="all"||d.detector===fdet) && (!selMatch||d.match===selMatch));
  const fbCounts = {agree:0, disagree:0, equivalent:0, none:0};
  fbBase.forEach(d => { const v = fbs[d.id]; fbCounts[v==="agree"?"agree":v==="disagree"?"disagree":v==="equivalent"?"equivalent":"none"]++; });
  const disagreeByMatch = {}, reviewedByMatch = {};
  decisions.forEach(d => {
    if(fbs[d.id]==="disagree") disagreeByMatch[d.match]=(disagreeByMatch[d.match]||0)+1;
    if(fbs[d.id] || d.feedback_note || d.best_option!=null) reviewedByMatch[d.match]=(reviewedByMatch[d.match]||0)+1;
  });
  let shown = fbBase.filter(d => fbFilter==="all" || (fbFilter==="none" ? !fbs[d.id] : fbs[d.id]===fbFilter));
  if(sort==="gap") shown = [...shown].sort((a,b)=>(b.ev_gap??-1)-(a.ev_gap??-1));
  const visible = shown.slice(0, limit);

  const shownMatches = matches.filter(m => acc==="both" ? m.cohort!=="challenger" : m.cohort===acc);
  const selMatchObj = matches.find(m => m.match_id===selMatch);
  const selMatchLabel = selMatchObj ? `${selMatchObj.champion} · ${selMatchObj.date}` : "";

  const statCards = stats ? [
    {label:"Partidas",    val:String(stats.matches), sub:Object.entries(stats.by_cohort||{}).filter(([k])=>k).map(([k,v])=>`${v} ${k}`).join(" · ")},
    {label:"Decisiones",  val:String(stats.decisions), sub:`${stats.detectors} detectores`},
    {label:"EV promedio", val:stats.ev_taken.toFixed(2), sub:`óptimo ${stats.ev_optimal.toFixed(2)} · gap ${stats.ev_gap.toFixed(2)}`},
    {label:"Clips",       val:String(stats.clips_decisions), sub:`en ${stats.clips_matches} partidas`},
    {label:"Feedback",    val:`${stats.feedback}`, sub:`de ${stats.decisions} revisadas`},
  ] : [];

  if(loading) return h("div",{style:{padding:"60px 0",textAlign:"center",color:"var(--color-text-tertiary)"}},"Cargando…");
  if(err) return h("div",{style:{padding:"40px 0",color:"var(--color-text-danger)"}}, "Error: "+err);

  // Navegacion: una seccion por vista, con su contador propio. El contador vive
  // aqui (y no en el titulo de la vista) porque es lo que decide a donde ir.
  const NAV = [
    {key:"session",   label:"Sesión de hoy", count: sessionData && sessionData.moments ? sessionData.moments.length : null},
    {key:"trades",    label:"Cola de trades", count: tradeData && tradeData.total || null},
    {key:"anchors",   label:"Validar exposición", count: anchorData && anchorData.total ? `${anchorData.n_marked}/${anchorData.total}` : null},
    {key:"decisions", label:"Decisiones",   count: stats ? stats.decisions : null},
    {key:"patterns",  label:"Patrones",     count: patterns.length || null},
    {key:"calibrate", label:"Calibrar",     count: null},
    {key:"review",    label:"Revisión",     count: queue && queue.n_disagree || null},
  ];
  const VIEW_TITLE = Object.fromEntries(NAV.map(n => [n.key, n.label]));

  return h("div", {className:"shell"},
    h("nav", {className:"nav", "aria-label":"Secciones"},
      h("div", null,
        h("div", {className:"nav-brand"},
          h("span", {className:"brand-slot", dangerouslySetInnerHTML:{__html:BRAND_MARK}}),
          h("span", null, "RiftPattern")),
        h("div", {className:"mono", style:{fontSize:"var(--t-micro)",color:"var(--ink-faint)",marginTop:3}},
          `${stats.patch ? "parche "+stats.patch : ""}`)
      ),
      h("div", {className:"nav-list"},
        ...NAV.map(n => h("button", {key:n.key, onClick:()=>setTab(n.key),
          className:"nav-item", "aria-current": tab===n.key ? "page" : undefined},
          h("span", {className:"nav-mark"}),
          h("span", {style:{minWidth:0,overflow:"hidden",textOverflow:"ellipsis"}}, n.label),
          n.count!=null && h("span", {className:"nav-count"}, String(n.count))))
      ),
      h("div", {style:{marginTop:"auto"}},
        h("div", {className:"lbl", style:{marginBottom:6}}, "Cuenta"),
        h("div", {style:{display:"flex",flexDirection:"column",gap:2}},
          ...[{key:"both",label:"Mis cuentas"}, ...Object.keys(stats.by_cohort||{}).filter(k=>k).sort().map(k=>({key:k,label:COHORT_LABELS[k]||k}))]
            .map(a => h("button", {key:a.key, onClick:()=>setAcc(a.key),
              className:"seg", "aria-pressed": acc===a.key,
              style:{justifyContent:"flex-start",width:"100%"}}, a.label))
        )
      )
    ),
    h("main", {className:"main"},
    // Banner de pipeline muerto (#11): la key expirada de 2026-06 paso 7 dias en
    // silencio porque key_alive solo vivia en ingest_status.json.
    ingest && ingest.key_alive===false && h("div", {className:"note note-bad", style:{marginBottom:"var(--s5)",color:"var(--signal-bad)"}},
      h("b", null, "API key de Riot muerta"),
      ` — ingesta parada${ingest.days_since_ingest!=null ? ` hace ${ingest.days_since_ingest} día${ingest.days_since_ingest===1?"":"s"}` : ""}` +
      `${ingest.last_ingested_utc ? ` (última partida ingestada: ${String(ingest.last_ingested_utc).slice(0,10)})` : ""}. ` +
      "Renueva la key en developer.riotgames.com y pégala en config.toml; auto_ingest se pone al día solo."
    ),
    h("div", {className:"stats"},
      ...statCards.map(s => h(StatCard, {key:s.label, ...s}))
    ),
    h("div", {style:{display:"flex",alignItems:"center",gap:"var(--s4)",flexWrap:"wrap",marginBottom:"var(--s5)"}},
      h("h1", {className:"h-view"}, VIEW_TITLE[tab] || ""),
      tab==="decisions" && h("div", {style:{display:"flex",gap:2,marginLeft:"auto"}},
        ...[{k:"matches",l:"Partidas recientes"},{k:"all",l:"Todas las decisiones"}].map(v =>
          h("button", {key:v.k, className:"seg", "aria-pressed":decView===v.k,
            onClick:()=>{ setDecView(v.k); if(v.k==="matches") setSelMatch(null); }}, v.l)))
    ),
    // ENTRADA POR PARTIDAS: sin partida elegida la vista es el listado ancho.
    // El recorrido es reconocer -> resumen -> decisiones, no una base de
    // decisiones crudas donde no se sabe por donde empezar.
    tab==="decisions" && decView==="matches" && !selMatch && h("div", {className:"panel"},
      h("div", {className:"panel-head"},
        h("span", {className:"lbl"}, "Partidas recientes"),
        h("span", {className:"mono", style:{marginLeft:"auto",fontSize:"var(--t-micro)",color:"var(--ink-faint)"}},
          `${shownMatches.length} partidas · ${shownMatches.reduce((a,m)=>a+m.decisions_count,0)} decisiones`)),
      h("div", {className:"panel-body"},
        shownMatches.length===0
          ? h("div", {style:{padding:"36px 0",textAlign:"center",color:"var(--ink-faint)",fontSize:"var(--t-sm)"}},
              "No hay partidas para esta cuenta.")
          : shownMatches.slice(0, matchLimit).map(m => h(MatchItem, {key:m.match_id, m, wide:true,
              active:false, disagree:disagreeByMatch[m.match_id]||0,
              reviewed:reviewedByMatch[m.match_id]||0, onClick:()=>setSelMatch(m.match_id)})),
        shownMatches.length>matchLimit && h("button", {onClick:()=>setMatchLimit(l=>l+20),
          className:"seg", style:{width:"100%",justifyContent:"center",marginTop:"var(--s2)"}},
          `Mostrar 20 más (${shownMatches.length-matchLimit} restantes)`)
      )
    ),
    tab==="decisions" && decView==="matches" && selMatch && h(MatchSummary, {
      m:selMatchObj, reviewed:reviewedByMatch[selMatch]||0, onBack:()=>setSelMatch(null)}),
    tab==="decisions" && h("div", {className:"decision-layout"},
      // Vista 1: sidebar de partidas -- solo en "Todas las decisiones", donde
      // sirve de filtro. En la entrada por partidas ya hay listado y resumen.
      decView==="all" && h("div", {className:"explore panel"},
        h("div", {className:"panel-head"},
          h("span", {className:"lbl"}, "Partidas"),
          h("span", {className:"mono", style:{marginLeft:"auto",fontSize:"var(--t-micro)",color:"var(--ink-faint)"}},
            String(shownMatches.length))),
        h("div", {className:"panel-body"},
          h("button", {onClick:()=>setSelMatch(null), "aria-pressed":selMatch===null,
            className:"seg", style:{width:"100%",justifyContent:"flex-start",marginBottom:2}},
            `Todas · ${shownMatches.reduce((a,m)=>a+m.decisions_count,0)} decisiones`),
          ...shownMatches.map(m => h(MatchItem, {key:m.match_id, m, active:selMatch===m.match_id, disagree:disagreeByMatch[m.match_id]||0, reviewed:reviewedByMatch[m.match_id]||0, onClick:()=>setSelMatch(m.match_id)}))
        )
      ),
      // Vista 2: decisiones del match (o de todos), ordenadas por game_time_ms
      h("div", {className:"decision-detail"},
        h("div", {style:{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap",alignItems:"center"}},
          h("button", {onClick:()=>setFdet("all"), style:{...sBadge(fdet==="all"),fontSize:11,padding:"4px 10px"}}, "Todos"),
          ...Object.entries(DET).map(([k,dd]) => h("button", {key:k, onClick:()=>setFdet(k),
            style:{fontSize:11,padding:"4px 10px",borderRadius:"var(--border-radius-md)",
              border: fdet===k ? `0.5px solid ${tonedBorder(dd.acc)}` : "0.5px solid transparent",
              background: fdet===k ? tint(dd.acc,8) : "transparent",
              color: fdet===k ? dd.acc : "var(--color-text-tertiary)"}}, dd.label)),
          h("div", {style:{marginLeft:"auto",display:"flex",gap:4}},
            ...[{key:"recent",label:"Cronológico"},{key:"gap",label:"Mayor gap EV"}]
              .map(s => h("button", {key:s.key, onClick:()=>setSort(s.key), style:{...sBadge(sort===s.key),fontSize:11,padding:"4px 10px"}}, s.label))
          )
        ),
        ((fbCounts.agree + fbCounts.disagree + fbCounts.equivalent) > 0 || fbFilter !== "all") && h("div",
          {style:{display:"flex",gap:5,marginBottom:10,alignItems:"center",flexWrap:"wrap"}},
          h("span", {className:"lbl", style:{marginRight:2}}, "Veredicto"),
          ...[
            {k:"all",        l:`Todas (${fbBase.length})`,               c:"var(--color-text-secondary)", bg:"var(--color-background-tertiary)"},
            {k:"disagree",   l:`✕ se equivoca (${fbCounts.disagree})`,   c:"var(--color-text-danger)",    bg:"var(--color-background-danger)"},
            {k:"equivalent", l:`≈ equivalentes (${fbCounts.equivalent})`,c:"var(--color-text-info)",      bg:"var(--color-background-info)"},
            {k:"agree",      l:`✓ acierta (${fbCounts.agree})`,          c:"var(--color-text-success)",   bg:"var(--color-background-success)"},
            {k:"none",       l:`sin revisar (${fbCounts.none})`,         c:"var(--color-text-tertiary)",  bg:"var(--color-background-tertiary)"},
          ].map(o => h("button", {key:o.k, onClick:()=>setFbFilter(o.k),
            style:{fontSize:11,fontWeight:fbFilter===o.k?700:500,padding:"3px 10px",borderRadius:"var(--border-radius-md)",cursor:"pointer",
              border: fbFilter===o.k ? `0.5px solid ${o.c}` : "0.5px solid transparent",
              background: fbFilter===o.k ? o.bg : "transparent",
              color: fbFilter===o.k ? o.c : "var(--color-text-tertiary)"}}, o.l))),
        h("div", {style:{fontSize:11,color:"var(--color-text-tertiary)",marginBottom:12,fontFamily:"var(--font-mono)"}},
          (selMatch ? selMatchLabel+" · " : "") + `${shown.length} decisiones`),
        selMatch && h("div", {style:{marginBottom:4}},
          h("div", {style:{display:"flex",gap:4,marginBottom:8}},
            ...[{k:"map",l:"Mapa"},{k:"timeline",l:"Línea de tiempo"},{k:"winprob",l:"Ventaja"}].map(v =>
              h("button", {key:v.k, onClick:()=>setVizMode(v.k), style:{...sBadge(vizMode===v.k),fontSize:11,padding:"4px 10px"}}, v.l))
          ),
          !mapData ? h("div", {className:"muted", style:{fontSize:11,padding:"8px 0"}}, "Cargando…")
            : h("div", null,
                vizMode==="map"
                  ? h(MatchMap, {data:mapData, fdet, expId:focusViz||vizOpen, onSelect:selectViz, onHover:setFocusViz})
                  : vizMode==="timeline"
                    ? h(MatchTimeline, {data:mapData, fdet, expId:focusViz||vizOpen, onSelect:selectViz, onHover:setFocusViz})
                    : h(WinProbChart, {data:mapData}),
                // Replay completo sincronizado: clic en un marcador del mapa/línea
                // de tiempo busca ese momento en el video (5s antes para contexto).
                replay && vizMode!=="winprob" && h("div", {style:{marginTop:8}},
                  h("video", {ref:replayRef, controls:true, preload:"metadata",
                    src:"/replay?match="+encodeURIComponent(selMatch), style:{maxHeight:300},
                    onLoadedMetadata:()=>{ if(pendingSeek!=null){ seekReplay(pendingSeek); setPendingSeek(null); } }}),
                  h("div", {className:"muted", style:{fontSize:10,marginTop:2}},
                    "Replay de la partida — cada punto de la viz es una decisión; clic = saltar a ese momento del video")),
                vizMode!=="winprob" && !vizOpen && h(VizAnnotation, {d:decisions.find(x=>x.id===focusViz), onOpen:selectViz}),
                vizMode!=="winprob" && vizOpen && decisions.find(x=>x.id===vizOpen) && h(DecisionCard, {
                  key:"viz-"+vizOpen, d:decisions.find(x=>x.id===vizOpen), exp:true,
                  onToggle:()=>setVizOpen(null), fb:fbs[vizOpen], onFb:setFb,
                  clipOpen:clipOpen===vizOpen, onClip:toggleClip, onSave:saveContext})
              )
        ),
        selMatch && h(SimilarMatches, {match:selMatch}),
        shown.length===0
          ? h("div", {className:"panel", style:{textAlign:"center",color:"var(--ink-faint)",padding:"40px 0",fontSize:"var(--t-sm)"}}, "Sin decisiones para este filtro")
          : h("div", {className:"panel", style:{marginTop:selMatch?"var(--s5)":0}},
              h("div", {className:"panel-head"},
                h("span", {className:"lbl"}, selMatch ? "Decisiones de la partida" : "Decisiones"),
                h("span", {className:"mono", style:{marginLeft:"auto",fontSize:"var(--t-micro)",color:"var(--ink-faint)"}},
                  String(shown.length))),
              ...visible.map(d => h(DecisionCard, {key:d.id, d, exp:exp===d.id,
                domId:"dec-"+d.id, highlight:jumpId===d.id,
                onToggle:()=>anchorExp("dec-"+d.id, ()=>setExp(exp===d.id?null:d.id)), fb:fbs[d.id], onFb:setFb,
                clipOpen:clipOpen===d.id, onClip:toggleClip, onSave:saveContext})),
              shown.length>limit && h("button", {onClick:()=>setLimit(l=>l+50),
                style:{...sBadge(false),width:"100%",padding:"10px",marginTop:6,fontSize:12,border:"0.5px solid var(--color-border-tertiary)"}},
                `Mostrar más (${shown.length-limit} restantes)`)
            )
      )
    ),
    tab==="session" && h(SessionView, {data:sessionData, done:sessionDone, decisions, fbs,
      onFb:sessionFb, onSave:sessionSave, onJump:jumpTo, onRefresh:newSession, onMore:loadMoreSession}),
    tab==="trades" && h(TradeQueueView, {data:tradeData, done:tradeDone, fbs,
      onFb:tradeFb, onSave:tradeSave, onJump:jumpTo, onRefresh:refreshTrade}),
    tab==="anchors" && h(AnchorSetView, {data:anchorData, fbs, onLabel:setAnchorLabel,
      onSave:saveContext, onJump:jumpTo, onRefresh:loadAnchors}),
    tab==="patterns" && h("div", null,
      h(ProgressCard, {prog: progress}),
      h(ExposureCard, {data: exposureData, onJump:jumpTo}),
      patterns.length===0
        ? h("div", {style:{textAlign:"center",color:"var(--color-text-tertiary)",padding:"40px 0",fontSize:13}}, "Sin patrones detectados para esta cuenta")
        : patterns.map(p => h(PatternCard, {key:p.id, p}))
    ),
    tab==="calibrate" && h(Calibrate),
    tab==="review" && h(ReviewQueue, {queue, onJump:jumpTo, onRefresh:loadQueue,
      decisions, fbs, onFb:setFb, onSave:saveContext})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
