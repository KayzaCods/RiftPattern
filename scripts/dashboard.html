<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiftPattern</title>
<style>
/* identidad-nocturna · escena: panel · topologia: 2 zonas (navegacion + contenido)
 * tono: instrumental con voz de ensayo · acento: azul carbon + acentos de detector propios
 * critica: F5 J4 E4 Es5 R4 V4
 * Capas OKLCH del preset "Oscuro azul afinado" (theme-lab). Los acentos de dominio
 * se conservan en su hex exacto: son valores elegidos a mano, no derivables. */
:root{
  /* --- capas --- */
  --bg:        oklch(15.2% 0.010 264);   /* raiz: azul carbon casi negro */
  --surface:   oklch(19.9% 0.011 261);   /* tarjeta / panel */
  --elevated:  oklch(24.0% 0.012 260);   /* celda interior, fila activa */
  --sunken:    oklch(11.5% 0.012 258);   /* pozo profundo: mapas, video, clips */
  /* Superficie de los controles hundidos (opciones, campos de texto). Iban en
     --sunken, la capa de los pozos de VISUALIZACION, donde el negro casi puro
     tiene sentido porque el mapa y el video son pantallas. Dentro de un panel
     (19.9%) esa capa cae 8 puntos y se lee como un agujero negro; esta se hunde
     lo justo para separarse del panel sin abrirle un pozo. */
  --inset:     oklch(16.8% 0.011 261);

  /* --- tinta --- */
  --ink:       oklch(90.0% 0.005 264);
  --ink-soft:  oklch(74.0% 0.012 258);
  --ink-faint: oklch(62.0% 0.014 258);

  /* --- hairlines --- */
  --hairline:        oklch(29.5% 0.012 262);
  --hairline-strong: oklch(40.0% 0.014 262);

  /* --- acentos de detector (propios, sin tocar) --- */
  --det-death:     #E24B4A;
  --det-trade:     #EF9F27;
  --det-tempo:     #378ADD;
  --det-objective: #1D9E75;
  --pit-dragon:    #c97a3a;   /* foso de Dragon; tambien lo experimental/no validado */
  --pit-baron:     #8a5fc0;   /* foso de Baron; tambien la variedad/anti-monocultivo */

  /* --- senales de estado --- */
  --signal-ok:   #2fb98d;   /* acierta, completado, ventaja */
  --signal-bad:  #e85b5a;   /* se equivoca, desventaja, error */
  --signal-warn: #EF9F27;   /* aviso, pendiente (mismo ambar que trade, a proposito) */
  --signal-nav:  #4a9be8;   /* seleccion, tu razonamiento, enlaces */

  /* --- mapa y visualizaciones --- */
  --map-river:     oklch(30% 0.035 235);
  --map-lane:      oklch(23% 0.040 225);
  --map-blue-base: oklch(48% 0.145 255);
  --map-red-base:  oklch(48% 0.160 28);

  /* --- fondos tintados (13-14%: legibles sobre --surface) --- */
  --wash-ok:   rgba(47,185,141,0.13);
  --wash-bad:  rgba(232,91,90,0.13);
  --wash-nav:  rgba(74,155,232,0.14);
  --wash-warn: rgba(239,159,39,0.13);
  --video-black:oklch(4% 0.005 264);

  /* --- escala tipografica, ratio 1.16 sobre base 14 --- */
  --t-micro: 10.4px;   --t-xs:   12.1px;   --t-sm:   13.0px;
  --t-base:  14.0px;   --t-md:   16.2px;   --t-lg:   18.8px;
  --t-xl:    21.9px;   --t-2xl:  25.3px;   --t-ghost: 56px;

  /* --- ritmo --- */
  --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:24px; --s7:36px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:10px;   /* chip / control / panel */
  --nav-w:212px; --content-max:1180px;

  --font-ui:"Aptos","IBM Plex Sans","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Bahnschrift","Space Grotesk","IBM Plex Sans","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* --- alias de compatibilidad ---------------------------------------------
   * Los estilos inline heredados leen estos nombres. Redefinirlos aqui hace que
   * toda la UI adopte la paleta nueva sin editar los literales; se van retirando
   * conforme cada componente pasa a las recetas de abajo. */
  --color-text-primary:var(--ink);
  --color-text-secondary:var(--ink-soft);
  --color-text-tertiary:var(--ink-faint);
  --color-text-success:var(--signal-ok);
  --color-text-danger:var(--signal-bad);
  --color-text-info:var(--signal-nav);
  --color-text-warning:var(--signal-warn);
  --color-background-primary:var(--bg);
  --color-background-secondary:var(--surface);
  --color-background-tertiary:var(--elevated);
  --color-background-success:var(--wash-ok);
  --color-background-danger:var(--wash-bad);
  --color-background-info:var(--wash-nav);
  --color-background-warning:var(--wash-warn);
  --color-border-secondary:var(--hairline-strong);
  --color-border-tertiary:var(--hairline);
  --border-radius-md:var(--radius-md);
  --border-radius-lg:var(--radius-lg);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip;
  font-family:var(--font-ui);
  font-size:var(--t-base);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
body{margin:0}
button{cursor:pointer;font-family:inherit;background:transparent;border:none;outline:none;color:inherit}
:where(button,a,input,textarea,select,[tabindex]):focus-visible{
  outline:2px solid var(--signal-nav);outline-offset:1px;border-radius:var(--radius-sm)}
button:focus-visible{box-shadow:none}
video{width:100%;border-radius:var(--radius-md);background:var(--video-black);margin-top:10px;max-height:420px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.muted{color:var(--ink-faint)}

/* ============================ recetas ============================ */

/* -- rotulos --
 * .lbl (versalitas) se reserva a los DOS ejes de orientacion del shell: la tira
 * de estadisticas y la navegacion. Repetirlo en cada bloque de cada tarjeta es
 * la "ceja diminuta en mayusculas" de plantilla, asi que dentro del contenido
 * las secciones usan .sec: peso y tinta, no versalitas. */
.lbl{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);font-weight:600}
.sec{font-size:var(--t-xs);font-weight:600;color:var(--ink-soft);margin-bottom:var(--s2)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* -- superficies -- */
.card{background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius-lg);padding:var(--s5)}
.well{background:var(--elevated);border-radius:var(--radius-md);padding:10px 12px}
.sunken{background:var(--sunken);border:1px solid var(--hairline);border-radius:var(--radius-md)}

/* -- lista abierta: filas separadas por hairline, no una caja por fila.
      Es lo que sostiene la densidad de "Decisiones" sin verse a plantilla. -- */
.list{border-top:1px solid var(--hairline)}
.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hairline);
  background:transparent;transition:background 160ms ease}
.row:hover{background:color-mix(in oklab,var(--ink) 4%,transparent)}
.row:active{background:var(--elevated)}
.row[data-open="1"]{background:var(--surface)}
.row-body{border-bottom:1px solid var(--hairline);background:var(--surface)}

/* -- chips y badges: sin relleno pesado; el color va en la tinta -- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-micro);
  padding:2px 7px;border-radius:var(--radius-sm);border:1px solid transparent;
  background:color-mix(in oklab,var(--ink) 7%,transparent);color:var(--ink-soft);white-space:nowrap}
.chip-strong{font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-micro);font-weight:600;
  padding:2px 8px;border-radius:var(--radius-sm);white-space:nowrap;
  color:var(--bg);background:var(--c,var(--ink-soft))}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--ink-faint))}

/* -- controles -- */
.seg{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);
  padding:5px 11px;border-radius:var(--radius-md);border:1px solid transparent;
  color:var(--ink-faint);background:transparent;transition:color 160ms ease,background 160ms ease}
.seg:hover{color:var(--ink-soft)}
.seg:active{color:var(--ink);background:var(--elevated)}
.seg[aria-pressed="true"],.seg.on{color:var(--ink);background:var(--elevated);border-color:var(--hairline-strong)}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;
  padding:6px 13px;border-radius:var(--radius-md);border:1px solid var(--hairline-strong);
  color:var(--ink);background:var(--elevated);transition:background 160ms ease}
.btn:hover:not(:disabled){background:color-mix(in oklab,var(--elevated) 80%,var(--ink) 20%)}
.btn:active:not(:disabled){background:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--bg);background:var(--signal-nav);border-color:var(--signal-nav)}
.btn-primary:hover:not(:disabled){background:color-mix(in oklab,var(--signal-nav) 88%,var(--ink) 12%)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-faint);font-weight:500}
.btn-quiet:hover:not(:disabled){background:transparent;color:var(--ink-soft)}
.field{width:100%;font-family:inherit;font-size:var(--t-xs);line-height:1.55;padding:9px 11px;
  border-radius:var(--radius-md);border:1px solid var(--hairline-strong);
  background:var(--inset);color:var(--ink);resize:vertical}
.field::placeholder{color:var(--ink-faint)}

/* -- opcion elegible --
 * Sin seleccion las tres opciones se leian como un bloque continuo: mismo peso,
 * mismo fondo y sin borde, asi que no habia donde ver que son TRES cosas entre
 * las que hay que escoger. Cada una es ahora una superficie propia con su
 * casilla; la seleccion sube de capa y pinta la casilla, pero la separacion ya
 * existe antes de elegir. */
.option{display:block;width:100%;text-align:left;margin-bottom:var(--s3);
  padding:9px 11px;border-radius:var(--radius-md);cursor:pointer;
  border:1px solid var(--hairline);background:var(--inset);
  transition:border-color 160ms ease,background 160ms ease}
.option:hover{border-color:var(--hairline-strong)}
.option[data-picked="1"]{border-color:var(--signal-nav);background:var(--elevated)}
.option-mark{width:12px;height:12px;flex:none;border-radius:3px;
  border:1px solid var(--hairline-strong);background:transparent;position:relative}
.option[data-picked="1"] .option-mark{border-color:var(--signal-nav);background:var(--signal-nav)}
.option[data-picked="1"] .option-mark::after{content:"";position:absolute;left:3px;top:0;
  width:4px;height:8px;border:solid var(--bg);border-width:0 1.6px 1.6px 0;transform:rotate(43deg)}

/* -- medidor: barra fina de proporcion (EV, terminos del HEF, pesos) -- */
.meter{height:3px;border-radius:2px;background:var(--hairline);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:2px;background:var(--c,var(--ink-soft))}

/* -- prosa: el bloque "Argumento" tratado como cita, no como tooltip -- */
.prose{font-size:var(--t-sm);line-height:1.75;color:var(--ink);text-align:justify;hyphens:auto;
  border-left:2px solid var(--hairline-strong);padding-left:var(--s4)}
.prose-nav{border-left-color:var(--signal-nav)}

/* -- aviso: caja de estado; el color va en el borde y la tinta -- */
.note{border:1px solid var(--hairline);border-radius:var(--radius-md);
  padding:10px 12px;font-size:var(--t-xs);line-height:1.6;color:var(--ink-soft)}
.note-nav{border-color:color-mix(in oklab,var(--signal-nav) 45%,var(--hairline));background:var(--wash-nav)}
.note-warn{border-color:color-mix(in oklab,var(--signal-warn) 45%,var(--hairline));background:var(--wash-warn)}
.note-bad{border-color:color-mix(in oklab,var(--signal-bad) 45%,var(--hairline));background:var(--wash-bad)}

/* -- lectura de una decisión: una secuencia con reglas, no cuatro tarjetas -- */
.decision-flow{display:flex;flex-direction:column}
.decision-stage{position:relative;padding:0 0 var(--s5)}
.decision-stage-marked{padding-left:28px}
.decision-stage+.decision-stage{padding-top:var(--s5);border-top:1px solid var(--hairline)}
.decision-stage-mark{position:absolute;left:0;top:2px;width:19px;height:19px;border:1px solid var(--hairline-strong);border-radius:50%;display:grid;place-items:center;color:var(--ink-faint);font-size:11px}
.decision-stage-title{display:block;font-size:var(--t-xs);font-weight:700;color:var(--ink-soft);
  margin:0 0 var(--s4);padding:6px 8px;border-radius:var(--radius-sm);
  background:color-mix(in oklab,var(--elevated) 70%,transparent)}
.decision-stage-analysis .decision-stage-title{color:var(--ink)}
.decision-stage-evidence .decision-stage-title{color:var(--ink-soft);background:color-mix(in oklab,var(--surface) 74%,var(--elevated))}
.decision-stage-player .decision-stage-title{color:var(--signal-nav);background:var(--wash-nav)}
.decision-stage-risk .decision-stage-title{color:var(--ink-soft)}
.decision-stage-agree .decision-stage-mark,.decision-stage-agree .decision-stage-title{color:var(--signal-ok);border-color:color-mix(in oklab,var(--signal-ok) 58%,var(--hairline))}
.decision-stage-equivalent .decision-stage-mark,.decision-stage-equivalent .decision-stage-title{color:var(--signal-warn);border-color:color-mix(in oklab,var(--signal-warn) 58%,var(--hairline))}
.decision-stage-disagree .decision-stage-mark,.decision-stage-disagree .decision-stage-title{color:var(--signal-bad);border-color:color-mix(in oklab,var(--signal-bad) 58%,var(--hairline))}
.decision-subsection-title{border-top:1px solid var(--hairline);padding-top:var(--s4);margin-top:var(--s2)}
.request-state{font-size:var(--t-xs);display:inline-flex;align-items:center;gap:4px}
.request-state[data-state="saving"]{color:var(--signal-warn)}
.request-state[data-state="success"]{color:var(--signal-ok)}
.request-state[data-state="error"]{color:var(--signal-bad)}

/* ============================ shell de dos zonas ============================ */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.nav{border-right:1px solid var(--hairline);background:var(--bg);
  padding:var(--s6) var(--s4) var(--s5);position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;gap:var(--s5)}
.nav-brand{font-family:var(--font-display);font-size:var(--t-lg);font-weight:600;
  letter-spacing:-.015em;line-height:1.1}
/* -- marca -- */
.nav-brand{display:flex;align-items:center;gap:9px}
.brand-slot{display:block;width:26px;height:26px;flex:none}
.brand-mark{width:100%;height:100%;display:block}

.nav-list{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--radius-md);font-size:var(--t-xs);
  color:var(--ink-faint);border:1px solid transparent;transition:color 160ms ease,background 160ms ease}
.nav-item:hover{color:var(--ink-soft);background:color-mix(in oklab,var(--ink) 4%,transparent)}
.nav-item:active{color:var(--ink);background:var(--elevated)}
.nav-item[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--hairline)}
.nav-item[aria-current="page"] .nav-mark{background:var(--signal-nav)}
.nav-mark{width:2px;align-self:stretch;border-radius:1px;background:transparent;flex:none}
.nav-count{margin-left:auto;font-family:var(--font-mono);font-size:var(--t-micro);color:var(--ink-faint)}
.main{min-width:0;padding:var(--s6) var(--s6) var(--s7);max-width:var(--content-max)}

/* -- tira de estadisticas: hairlines verticales, no cinco tarjetas clonicas.
      Deliberadamente silenciosa: orienta, no es el protagonista de la vista. -- */
.stats{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--radius-lg);
  padding:var(--s4) var(--s5);margin-bottom:var(--s5)}
.stat{display:flex;flex-direction:column;gap:1px;padding-right:var(--s6);min-width:104px}
.stat+.stat{border-left:1px solid var(--hairline);padding-left:var(--s6)}
.stat-val{font-family:var(--font-mono);font-size:var(--t-md);font-weight:600;line-height:1.2}

/* -- fila de partida: el retrato ancla el reconocimiento y el KDA es el bloque
      numerico prominente. Una sola linea de metadata; la cuadricula de dos
      columnas separaba datos relacionados y obligaba a leer etiquetas. -- */
/* Cada partida es una celda propia, no un renglon de una lista continua: son
   objetos que se eligen de uno en uno, y unidas por hairline se leian como un
   bloque homogeneo. Dentro del panel (--surface) la celda baja a --bg, asi que
   se hunde; la activa sube a --elevated y marca el borde. */
.match-row{display:flex;align-items:center;gap:9px;padding:8px 9px;
  background:var(--bg);border:1px solid var(--hairline);
  border-radius:var(--radius-md);margin-bottom:var(--s2)}
.match-row:hover{border-color:var(--hairline-strong);background:var(--surface)}
.match-body{flex:1;min-width:0}
.portrait{width:34px;height:34px;flex:none;border-radius:var(--radius-md);overflow:hidden;
  background:var(--elevated);border:1px solid var(--hairline);display:block}
.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.portrait-fb{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:var(--t-sm);font-weight:600;color:var(--ink-faint)}
.kda{font-size:var(--t-xs);font-weight:600;color:var(--ink);letter-spacing:.01em}
.kda-sep{color:var(--ink-faint);margin:0 2px;font-weight:400}
.portrait-lg{width:46px;height:46px}

/* Distribucion de detectores: orden fijo, icono + conteo. Como la build de
   OP.GG, se lee por posicion; a diferencia de ella, el conteo va en texto
   porque aqui el numero ES el dato, no un adorno del icono. */
.detmix{display:inline-flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.detmix-item{display:inline-flex;align-items:center;gap:4px;
  font-size:var(--t-micro);color:var(--ink-soft);white-space:nowrap}

/* La fila ancha de "Partidas recientes" respira mas que la de la columna
   estrecha: mismo componente, distinta densidad segun donde vive. */
.match-row-wide{padding:11px 13px;gap:12px}

/* -- paneles --
 * El sistema tiene tres capas de luminosidad y durante un rato solo se uso una:
 * todo vivia sobre --bg y la profundidad la cargaban los hairlines solos, asi
 * que la pantalla se leia como una sola lamina rayada. Cada bloque de trabajo se
 * apoya ahora en --surface y el fondo queda como aire entre ellos. No son
 * tarjetas clonicas: son paneles con estructura interna distinta -- uno es una
 * lista de partidas con retrato, otro un flujo de decisiones -- y por eso el
 * relleno y el ritmo de cada uno cambian. */
.panel{background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius-lg);overflow:hidden;
  /* El anclaje automatico de Chrome elige su propia ancla y se peleaba con la
     compensacion explicita del anclaje: entre las dos el scroll saltaba
     1472 px en vez de quedarse quieto. Aqui manda una sola. */
  overflow-anchor:none}
.panel-head{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:10px var(--s4);border-bottom:1px solid var(--hairline);background:var(--bg)}
.panel-body{padding:var(--s2) var(--s2)}
.panel-body>.row:last-child,.panel-body>div:last-child>.row:last-child{border-bottom:0}

/* Columna de exploracion (partidas) frente al detalle: dos zonas de la vista. */
.explore{width:242px;flex-shrink:0;max-height:78vh;overflow-y:auto;position:sticky;top:var(--s4)}
.decision-layout{display:flex;gap:var(--s5);align-items:flex-start}
.decision-detail{flex:1;min-width:0}

/* Las filas dentro de un panel ya no necesitan el hairline a sangre: el panel
   las contiene, asi que la linea se acorta y el hover sube de capa.
   Se excluye .match-row: esa es una celda con borde propio, y sin el :not()
   estas reglas le ganaban por orden y le dejaban el radio en 0 de la segunda
   celda en adelante. */
.panel .row:not(.match-row){border-radius:var(--radius-md);border-bottom-color:transparent}
.panel .row:not(.match-row)+.row:not(.match-row){border-top:1px solid var(--hairline);border-radius:0}
.panel .row:not(.match-row):hover{background:var(--elevated)}

/* -- ticket: un item de cola --
 * Sesion, trades, anclas y revision son colas de trabajo: cada entrada es una
 * unidad independiente que se abre, se marca y se cierra. Ahi la superficie
 * propia SI corresponde -- no es la retícula de tarjetas clonicas del veto, es
 * el mismo objeto repetido. Abierto sube de capa para que se vea cual estas
 * trabajando sin buscar el borde. */
.ticket{background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--s3);
  transition:border-color 160ms ease}
.ticket:hover{border-color:var(--hairline-strong)}
.ticket[data-open="1"]{border-color:var(--hairline-strong);background:var(--elevated)}
.ticket>button:first-child{border-bottom-color:transparent!important}
.ticket[data-open="1"]>button:first-child{border-bottom-color:var(--hairline)!important}

h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;letter-spacing:-.01em}
.h-view{font-size:var(--t-md);font-weight:600;font-family:var(--font-display)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--hairline);
    flex-direction:column;padding:var(--s5) var(--s4)}

  .nav-item{width:auto;flex:0 0 auto;white-space:nowrap}
  .main{padding:var(--s5) var(--s4) var(--s6)}

  .explore{position:static;width:100%;max-height:36vh;overflow-y:auto;border-right:0;border-bottom:1px solid var(--hairline);padding:0 0 var(--s4)}
  .decision-layout{flex-direction:column}

}
@media (max-width:480px){

  .stat{min-width:0;padding:0}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

5.50136,-1.61041 15.7368,-1.17967 22.82727,-1.36545 10.17885,1.31815 13.96591,2.03223 21.33334,5.05889 25.26935,7.51959 39.1765,32.04753 57.29679,49.40278 31.16309,34.25319 63.49223,67.53429 93.917,102.40298 5.39626,6.6004 1.60049,16.68457 8.68927,22.94025 15.63768,17.4293 31.25803,35.05827 46.75427,52.66938 C 689.55539,757.76236 705.86954,777.67349 724,796 c 9.22486,11.99316 19.87402,22.11364 30,33 9.45394,5.69438 22.86173,6.44465 31,-2 8.80879,-10.17607 21.36731,-19.84731 28.88635,-31.7727 4.91709,-11.402 -3.07713,-22.29022 -11.63147,-29.36222 C 787.34155,750.26636 773.85313,735.18073 758,720 c -8.49649,-9.97897 -19.18661,-20.06771 -29,-30 -7.86448,-10.03297 -20.18346,-19.98625 -27.98839,-29.98839 -11.69683,-10.39471 -21.01607,-26.02592 -37.62249,-28.05596 -9.31399,0.48192 -13.79552,-8.3325 -20.11172,-14.07896 C 605.18493,578.58446 567.09247,539.29223 529,500 c 14.23262,-4.96252 27.55514,-11.5457 38.97865,-21.51058 11.86275,-11.42374 22.12992,-25.13192 26.87651,-40.91352 2.21537,-7.79714 3.48869,-15.18368 4.60166,-23.39317 0.20811,-6.74933 0.38266,-16.03043 -0.45682,-22.99473 -0.012,-13.57578 -4.97604,-26.92733 -11.81082,-39.33666 -9.175,-14.89193 -21.51117,-27.97902 -37.18337,-35.84553 C 539.51686,310.29602 527.98856,306.63058 516,306 c -7.06356,-1.66883 -14.87017,-1.54377 -22.43601,-2 0,0 -138.70242,0.48761 -140.56399,1 z"/></svg>';
const h = React.createElement;

const DET = {
  death_v1:               {label:"Muerte",   acc:"var(--det-death)"},
  trade_v1:               {label:"Trade",    acc:"var(--signal-warn)"},
  tempo_v1:               {label:"Tempo",    acc:"var(--det-tempo)"},
  objective_readiness_v1: {label:"Objetivo", acc:"var(--det-objective)"},
};

const GLYPH = {down:"▾",up:"▴",check:"✓",x:"✕",alert:"⚠",play:"▶",dot:"●",approx:"≈"};

// Iconos de detector: SVG propios sobre una reticula comun de 16, trazo unico y
// currentColor. Son iconos de CATEGORIA (pueden tener caracter), a diferencia de
// los glifos de control, que siguen siendo austeros. Nunca van solos: acompanan
// siempre a la etiqueta del detector, para no depender del color ni de la forma.
const DET_PATHS = {
  // muerte: craneo de mandibula angular. Los ojos NO van de trazo: a 12px un
  // circulo hueco se cierra en una mancha, mientras que una cuenca rellena e
  // inclinada sobrevive al reducido y es ademas la que da el gesto agresivo.
  death_v1: "M8 2.3c-3 0-5.1 2-5.1 4.8 0 1.4.6 2.5 1.4 3.2v1.9c0 .6.5 1.1 1.1 1.1h5.2c.6 0 1.1-.5 1.1-1.1v-1.9c.8-.7 1.4-1.8 1.4-3.2 0-2.8-2.1-4.8-5.1-4.8Z",
  // trade: dos flechas que se cruzan (intercambio de dano)
  trade_v1: "M2.5 5.5h9 M9 3l2.5 2.5L9 8 M13.5 10.5h-9 M7 8l-2.5 2.5L7 13",
  // tempo: reloj
  tempo_v1: "M8 3.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6Z M8 5.6V8l1.9 1.2",
  // objetivo: un solo rombo con el centro marcado por un punto. El rombo
  // interior anidado casi tocaba el exterior y a 12px se leia como un rombo
  // macizo, no como dos formas.
  objective_readiness_v1: "M8 2.2 13.2 8 8 13.8 2.8 8Z",
};
// Formas rellenas: aguantan el reducido mucho mejor que el trazo fino.
const DET_FILLS = {
  death_v1: [
    "M4.9 6.4 7.1 7.3l-.6 1.9-2.1-.9Z",   // cuenca izquierda, inclinada hacia dentro
    "M11.1 6.4 8.9 7.3l.6 1.9 2.1-.9Z",   // cuenca derecha
    "M8 9.7l.85 1.7h-1.7Z",               // hueco nasal
  ],
};
// Punto central relleno: circulo, no un segundo rombo.
const DET_DOTS = { objective_readiness_v1: [8, 8, 1.7] };
// Metadata de fila. Antes era UNA cadena mono donde campeon, fecha, minuto y gap
// pesaban lo mismo y el ojo no tenia donde aterrizar. Cada dato recibe ahora su
// tratamiento: el campeon es texto, el minuto va en mono porque es un dato, la
// fecha queda tenue y el gap EV se separa como medida, con su explicacion.
function RowMeta({champion, date, time, evGap}){
  return h("span", {style:{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",fontSize:"var(--t-micro)",lineHeight:1.5}},
    champion && h("span", {style:{color:"var(--ink-soft)",fontWeight:600}}, champion),
    time && h("span", {className:"mono", style:{color:"var(--ink)"}}, time),
    date && h("span", {style:{color:"var(--ink-faint)"}}, date),
    evGap!=null && h("span", {className:"chip mono",
      title:"Diferencia de EV entre la mejor opción y la que tomaste: cuánto había en juego"},
      "gap EV ", evGap.toFixed(2))
  );
}

function DetIcon({detector, size, color}){
  const d = DET_PATHS[detector];
  if(!d) return null;
  const s = size||14, fills = DET_FILLS[detector] || [], dot = DET_DOTS[detector];
  const ink = color || "currentColor";
  return h("svg", {width:s, height:s, viewBox:"0 0 16 16", fill:"none",
      stroke:ink, strokeWidth:1.4, strokeLinecap:"round",
      strokeLinejoin:"round", "aria-hidden":"true", style:{flexShrink:0,display:"block"}},
    ...d.split(" M").map((seg,i) => h("path", {key:"s"+i, d:(i?"M":"")+seg})),
    ...fills.map((f,i) => h("path", {key:"f"+i, d:f, fill:ink, stroke:"none"})),
    dot && h("circle", {cx:dot[0], cy:dot[1], r:dot[2], fill:ink, stroke:"none"}));
}
const tint = (color, amount=14) => `color-mix(in oklab, ${color} ${amount}%, transparent)`;
const tonedBorder = (color, amount=40) => `color-mix(in oklab, ${color} ${amount}%, var(--hairline))`;
function Ico({name,size,color}){
  return h("span",{style:{fontSize:size||13,color:color||"inherit",lineHeight:1,display:"inline-block"},"aria-hidden":"true"}, GLYPH[name]||"");
}

function evColor(v){
  if(v==null) return "var(--color-text-tertiary)";
  if(v>=0.65) return "var(--color-text-success)";
  if(v>=0.40) return "var(--signal-warn)";
  return "var(--color-text-danger)";
}
function evBg(v){
  if(v==null) return "var(--color-background-tertiary)";
  if(v>=0.65) return "var(--color-background-success)";
  if(v>=0.40) return "var(--wash-warn)";
  return "var(--color-background-danger)";
}
function trendInfo(t){
  if(t==="worsening") return {icon:"up",label:"Empeorando",c:"var(--det-death)"};
  if(t==="improving") return {icon:"down",label:"Mejorando",c:"var(--det-objective)"};
  return {icon:"dot",label:"Estable",c:"var(--signal-warn)"};
}
const fmtEV = v => v==null ? "—" : v.toFixed(2);

function sBadge(active){
  return {
    fontSize:11, padding:"5px 12px", borderRadius:"var(--border-radius-md)",
    border: active ? "0.5px solid var(--color-border-secondary)" : "0.5px solid transparent",
    background: active ? "var(--color-background-secondary)" : "transparent",
    color: active ? "var(--color-text-primary)" : "var(--color-text-tertiary)",
  };
}

const FB_BTNS = [
  {key:"agree",      label:"acierta",        icon:"check"},
  {key:"equivalent", label:"≈ equivalentes", icon:"approx"},
  {key:"disagree",   label:"se equivoca",    icon:"x"},
];
const MARK_TYPE_BTNS = [
  {key:"decision",        label:"decisión"},
  {key:"execution",       label:"ejecución"},
  {key:"mixed",           label:"mixta"},
  {key:"missing_context", label:"contexto faltante"},
  {key:"wrong_moment",    label:"momento equivocado"},
];
const MARK_TYPE_HELP = {
  decision:"La lectura del estado era el problema: aun ejecutando perfecto, convenía otra opción. Esta marca sí entrena al learner.",
  execution:"La opción era razonable; falló cómo se ejecutó (timing, mecánica, posicionamiento o recursos). No entrena al learner.",
  mixed:"Hubo dos fallas independientes: la opción no era buena y la ejecución también empeoró el resultado. No entrena al learner.",
  missing_context:"El sistema no ve un dato decisivo. Escribe qué información faltó y cómo cambiaba la lectura. No entrena al learner.",
  wrong_moment:"El análisis puede ser válido, pero está anclado al instante equivocado. Indica cuál era el momento relevante. No entrena al learner.",
};
// Friendly labels for cohorts; unknown cohorts fall back to their raw key.
const COHORT_LABELS = {master:"Cuenta principal · Master", emerald:"Cuenta secundaria · Emerald", challenger:"Referencia · Challenger"};

function powerColor(idx){
  if(idx>=0.55) return "var(--color-text-success)";
  if(idx<=0.45) return "var(--color-text-danger)";
  return "var(--signal-warn)";
}
// HEF: composite, auditable decision-quality score with its breakdown — the
// weighted terms (power/info/wave/action-fit) and the penalties Π applied.
const HEF_TERM_LABELS = {power:"Poder", info:"Info / visión", wave:"Oleada", action_fit:"Acción ↔ estado"};
function HefPanel({hef}){
  const c = powerColor(hef.score);
  const terms = hef.terms || {}, weights = hef.weights || {}, pen = hef.penalties || {};
  return h("div", {style:{marginBottom:14}},
    h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}},
      h("span", {className:"sec", style:{marginBottom:0}}, "Evaluación (HEF)"),
      h("span", {style:{fontSize:13,fontFamily:"var(--font-mono)",fontWeight:600,color:c}}, `${hef.score.toFixed(2)} · ${hef.label||""}`)
    ),
    ...Object.keys(terms).map(k => h("div", {key:k, style:{display:"flex",alignItems:"center",gap:8,marginBottom:3}},
      h("span", {style:{fontSize:10,color:"var(--color-text-tertiary)",width:92,flexShrink:0}}, HEF_TERM_LABELS[k]||k),
      h("div", {style:{flex:1,height:5,borderRadius:3,background:"var(--color-background-tertiary)",overflow:"hidden"}},
        h("div", {style:{height:"100%",width:`${terms[k]*100}%`,background:powerColor(terms[k])}})),
      h("span", {style:{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",width:62,textAlign:"right"}}, `${terms[k].toFixed(2)} ·ω${weights[k]||0}`)
    )),
    Object.keys(pen).length>0 && h("div", {style:{display:"flex",flexWrap:"wrap",gap:4,marginTop:6,alignItems:"center"}},
      h("span", {style:{fontSize:10,color:"var(--color-text-tertiary)"}}, `base ${hef.base!=null?hef.base.toFixed(2):"—"} −`),
      ...Object.entries(pen).map(([k,v]) => h("span", {key:k, style:{fontSize:10,color:"var(--color-text-danger)",background:"var(--color-background-danger)",borderRadius:4,padding:"1px 6px"}}, `${k.replace(/_/g," ")} −${v}`))
    )
  );
}

function DecisionStage({num, icon, title, tone, marker=false, children}){
  return h("section", {className:`decision-stage${marker ? " decision-stage-marked" : ""}${tone ? " decision-stage-"+tone : ""}`},
    marker && h("span", {className:"decision-stage-mark", "aria-hidden":"true"}, icon || num),
    h("h3", {className:"decision-stage-title"}, `${num}. ${title}`), children);
}

function DecisionCard({d, exp, onToggle, fb, onFb, clipOpen, onClip, onSave, domId, highlight}){
  const det = DET[d.detector] || {label:d.detector, acc:"var(--ink-faint)"};
  const [note, setNote] = useState(d.feedback_note || "");
  // Si la marca es HISTORICA (#25) el indice guardado apunta a un conjunto de
  // opciones que ya no existe: pre-seleccionarlo pintaria "tu elección" sobre una
  // opcion que el usuario nunca eligio. La eleccion real se muestra, resuelta
  // contra la lista de entonces, en el bloque de marca historica.
  const [best, setBest] = useState((d.best_option==null || d.historical_mark) ? null : d.best_option);
  const [markType, setMarkType] = useState(d.mark_type || null);
  const [saveState, setSaveState] = useState("idle");
  const [feedbackState, setFeedbackState] = useState("idle");
  // Momento del intercambio (via HP del recorder): se pide PEREZOSO al abrir el
  // clip de un trade (leer los snapshots de 50-100 MB en la ruta masiva colgaba
  // el dashboard). Mientras no llega, el seek cae al inicio del minuto.
  const [momentMs, setMomentMs] = useState(null);
  const clipVidRef = useRef(null);
  useEffect(() => {
    if(!clipOpen || d.detector!=="trade_v1" || momentMs!=null) return;
    fetch("/api/trade_moment?id="+d.id).then(r=>r.json())
      .then(j => { if(j && j.moment_ms!=null){ setMomentMs(j.moment_ms);
        const v=clipVidRef.current; const off=(d.clip_offset_s||0)+(j.moment_ms-d.game_time_ms)/1000-5;
        if(v && off>0){ try{ v.currentTime=off; }catch(_){} } } }).catch(()=>{});
  }, [clipOpen, d.id]);
  // Near-tie: when the top two options are within ~0.10 EV they're practically
  // equivalent — the system isn't really "recommending" one. Surfacing this stops
  // the user from marking "se equivoca" just for picking their own valid option.
  const _evs = (d.options||[]).map(o=>o.ev||0).slice().sort((a,b)=>b-a);
  const tieGap = _evs.length>=2 ? Math.round((_evs[0]-_evs[1])*100)/100 : null;
  const isTie = tieGap!=null && tieGap<=0.10;
  // Fila de lista abierta: separada por hairline, no una caja con filete de
  // acento (esa combinacion —raya de color sobre tarjeta redondeada, repetida en
  // cada fila— es la receta de plantilla). El detector lo identifica su etiqueta.
  const fbTone = fb === "agree" ? {ink:"var(--signal-ok)", wash:"var(--wash-ok)"}
    : fb === "equivalent" ? {ink:"var(--signal-warn)", wash:"var(--wash-warn)"}
    : fb === "disagree" ? {ink:"var(--signal-bad)", wash:"var(--wash-bad)"} : null;
  return h("div", {id: domId, "data-open": exp?"1":undefined, style:{
      borderBottom:`1px solid ${fbTone ? `color-mix(in oklab,${fbTone.ink} 42%,var(--hairline))` : "var(--hairline)"}`,
      background: fbTone ? `color-mix(in oklab,${fbTone.wash} 58%,${exp ? "var(--surface)" : "transparent"})` : (exp ? "var(--surface)" : "transparent"),
      boxShadow: highlight ? "inset 2px 0 0 var(--signal-nav)" : undefined,
    }},
    h("button", {onClick:onToggle, "aria-expanded":!!exp,
      style:{padding:"11px 14px",width:"100%",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
      h("span", {className:"tag", style:{"--c":det.acc}}, h(DetIcon,{detector:d.detector,size:12}), det.label),
      h("span", {style:{fontSize:"var(--t-sm)",fontWeight:600}}, d.champion),
      d.role && h("span", {className:"chip"}, ROLE_L[d.role]||d.role),
      h("span", {className:"mono", style:{fontSize:"var(--t-xs)",color:"var(--ink-faint)"}}, `${d.time} · ${d.date}`),
      h("div", {style:{marginLeft:"auto",display:"flex",alignItems:"center",gap:7}},
        fb && (()=>{ const m = fb==="disagree"?{c:"danger",ic:"x",t:"se equivoca"}:fb==="equivalent"?{c:"info",ic:"approx",t:"≈ equiv"}:{c:"success",ic:"check",t:"acierta"};
          return h("span", {title:"Marcaste: "+m.t,
            style:{fontSize:10,fontWeight:700,display:"flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:"var(--border-radius-md)",
              color:`var(--color-text-${m.c})`, background:`var(--color-background-${m.c})`}},
            h(Ico,{name:m.ic,size:11}), m.t); })(),
        // La marca esta guardada pero ya no cuenta: hay que verlo sin expandir.
        d.historical_mark && h("span", {title:"Tu marca ya no entrena al learner: las opciones cambiaron. Expande para verla.",
          style:{fontSize:10,fontWeight:700,display:"flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:"var(--border-radius-md)",
            color:"var(--color-text-warning)", background:"var(--color-background-warning)"}},
          h(Ico,{name:"alert",size:11}), "histórica"),
        // El circulo de reward y el "HEF 0.17" desaparecen de la fila colapsada:
        // eran conceptos internos sin explicacion, y un numero desnudo no dice
        // si esta bien o mal. En su lugar va la MISMA etiqueta interpretable que
        // usa el detalle (hef_label del backend), asi que nunca pueden divergir.
        // El valor exacto sigue disponible al expandir.
        d.hef && d.hef.label && h("span", {
          title:`Evaluación del programa: ${d.hef.score!=null?d.hef.score.toFixed(2):"—"} · expande para ver el desglose`,
          style:{fontSize:"var(--t-micro)",fontWeight:600,color:powerColor(d.hef.score),
            background:evBg(d.hef.score),padding:"3px 9px",borderRadius:"var(--radius-sm)",whiteSpace:"nowrap"}},
          d.hef.label),
        h(Ico, {name:exp?"up":"down",size:13,color:"var(--color-text-tertiary)"})
      )
    ),
    h("div", {style:{padding:"0 14px 12px",fontSize:"var(--t-sm)",color:"var(--ink)"}}, d.moment),
    exp && h("div", {className:"decision-flow", style:{borderTop:"1px solid var(--hairline)",padding:"var(--s5) 14px"}},
      h(DecisionStage, {num:"01", title:"Análisis del programa", tone:"analysis"},
        d.outcome && h("p", {style:{fontSize:"var(--t-xs)",color:"var(--ink-soft)",marginBottom:d.hef&&d.hef.score!=null?"var(--s4)":0}}, d.outcome),
        h("p", {className:"sec"}, "Inferencia del programa"),
        h("div", {className:"prose", style:{marginBottom:"var(--s5)"}}, d.argument),
        d.hef && d.hef.score!=null && h(HefPanel, {hef:d.hef})
      ),
      h(DecisionStage, {num:"02", title:"Evidencia disponible", tone:"evidence"},
      h("p", {className:"sec"}, "Observación · contexto capturado"),
      h("div", {className:"well", style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(132px,1fr))",gap:"7px 18px",marginBottom:"var(--s5)"}},
        ...Object.entries(d.ctx).map(([k,v]) =>

// Antiguedad en lenguaje natural. Sale de game_start_ms crudo: la fecha ya
// formateada ("5 ago") no sirve para restar, y "hace 5 dias" es lo que de verdad
// se usa para situar una partida en la memoria.
function fmtAge(startMs){
  if(startMs==null) return null;
  // Dias de CALENDARIO, no horas transcurridas: una partida de anoche a las
  // 23:00 esta a 10 horas, pero para quien la recuerda fue "ayer", no "hoy".
  const at = new Date(startMs), now = new Date();
  const dayOf = x => Math.floor(new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime() / 86400000);
  const d = dayOf(now) - dayOf(at);
  if(d < 0) return null;
  if(d === 0) return "hoy";
  if(d === 1) return "ayer";
  if(d < 30) return `hace ${d} días`;
  const mo = Math.floor(d / 30);
  return mo === 1 ? "hace 1 mes" : `hace ${mo} meses`;
}

// Distribucion de detectores de una partida: icono + conteo, en orden fijo. El
// orden estable es lo que permite comparar dos partidas de un vistazo sin leer
// las etiquetas, igual que la build de OP.GG. Los detectores sin decisiones no
// se dibujan: un cero ocupa sitio y no informa.
const DET_ORDER = ["death_v1", "objective_readiness_v1", "trade_v1", "tempo_v1"];
function DetectorMix({counts, size}){
  if(!counts) return null;
  const present = DET_ORDER.filter(k => (counts[k]||0) > 0);
  if(!present.length) return null;
  return h("span", {className:"detmix"},
    ...present.map(k => {
      const det = DET[k] || {label:k, acc:"var(--ink-faint)"};
      return h("span", {key:k, className:"detmix-item", title:`${counts[k]} de ${det.label.toLowerCase()}`},
        h(DetIcon, {detector:k, size:size||12, color:det.acc}),
        h("span", {className:"mono"}, String(counts[k])));
    }));
}

// Summoner's Rift landmarks in world coords (0..M, y up). Drawn vectorially.
const SR_BLUE = [1600, 1600], SR_RED = [13400, 13400];
const SR_DRAGON = [9866, 4414], SR_BARON = [5007, 10471];
const timeHue = t => `color-mix(in oklab, var(--signal-nav) ${Math.round((1-t)*100)}%, var(--signal-warn))`;
const rewardStroke = v => v==null ? "var(--ink-faint)" : (v>0 ? "var(--color-text-success)" : (v<0 ? "var(--color-text-danger)" : "var(--ink-faint)"));

function MatchMap({data, fdet, expId, onSelect, onHover}){
  const M = data.map_max || 15000;
  const fy = y => M - y;  // LoL y grows up; SVG y grows down
  const path = data.path || [], decs = data.decisions || [];
  const detsPresent = [...new Set(decs.map(d => d.detector))];
  const lane = pts => h("polyline", {points:pts.map(p=>`${p[0]},${fy(p[1])}`).join(" "),
    fill:"none", stroke:"var(--map-river)", strokeWidth:300, strokeLinejoin:"round", strokeLinecap:"round", opacity:0.7});
  // Route as time-colored segments (blue start -> amber end) conveys flow/evolution.
  const segs = [];
  for(let i=1;i<path.length;i++){
    const t = path.length<=1 ? 0 : i/(path.length-1);
    segs.push(h("line", {key:"seg"+i, x1:path[i-1].x, y1:fy(path[i-1].y), x2:path[i].x, y2:fy(path[i].y),
      stroke:timeHue(t), strokeWidth:130, opacity:0.65, strokeLinecap:"round"}));
  }
  return h("div", {style:{marginBottom:16}},
    h("div", {className:"sec"}, "Mapa de la partida"),
    h("svg", {viewBox:`0 0 ${M} ${M}`, style:{width:"100%",maxWidth:420,aspectRatio:"1 / 1",display:"block",background:"var(--sunken)",borderRadius:8,border:"0.5px solid var(--color-border-tertiary)"}},
      h("line", {x1:0,y1:0,x2:M,y2:M,stroke:"var(--map-lane)",strokeWidth:1100,strokeLinecap:"round",opacity:0.6}),
      lane([[1600,1600],[1600,13400],[13400,13400]]),   // top lane (left + top edges)
      lane([[1600,1600],[13400,1600],[13400,13400]]),   // bot lane (bottom + right edges)
      lane([[1600,1600],[13400,13400]]),                // mid lane (diagonal)
      h("circle", {cx:SR_DRAGON[0],cy:fy(SR_DRAGON[1]),r:430,fill:"none",stroke:"var(--pit-dragon)",strokeWidth:75,opacity:0.75}),
      h("circle", {cx:SR_BARON[0],cy:fy(SR_BARON[1]),r:430,fill:"none",stroke:"var(--pit-baron)",strokeWidth:75,opacity:0.75}),
      h("circle", {cx:SR_BLUE[0],cy:fy(SR_BLUE[1]),r:780,fill:"var(--map-blue-base)",opacity:0.4}),
      h("circle", {cx:SR_RED[0],cy:fy(SR_RED[1]),r:780,fill:"var(--map-red-base)",opacity:0.4}),
      ...segs,
      path.length>0 && h("circle", {cx:path[0].x,cy:fy(path[0].y),r:240,fill:"var(--ink)",opacity:0.9}),  // start
      ...decs.map(d => {
        const det = DET[d.detector] || {label:d.detector, acc:"var(--ink-faint)"};
        const dim = (fdet && fdet!=="all" && d.detector!==fdet);
        return h("g", {key:d.id, opacity:dim?0.15:1, style:{cursor:"pointer"}, onClick:()=>onSelect(d.id), onMouseEnter:()=>onHover&&onHover(d.id)},
          expId===d.id && h("circle", {cx:d.x,cy:fy(d.y),r:620,fill:"none",stroke:"var(--ink)",strokeWidth:70,opacity:0.9}),
          h("circle", {cx:d.x,cy:fy(d.y),r:380,fill:det.acc,fillOpacity:0.9,stroke:rewardStroke(d.reward_score),strokeWidth:95},
            h("title", null, `${det.label} · ${d.time} — ${d.moment}`)));
      })
    ),
    h("div", {style:{display:"flex",flexWrap:"wrap",gap:"3px 10px",marginTop:6}},
      ...detsPresent.map(dt => { const det = DET[dt] || {label:dt,acc:"var(--ink-faint)"};
        return h("span", {key:dt, style:{display:"inline-flex",alignItems:"center",gap:4,fontSize:10,color:"var(--color-text-tertiary)"}},
          h("span", {style:{width:8,height:8,borderRadius:"50%",background:det.acc,display:"inline-block"}}), det.label); }),
      h("span", {style:{display:"inline-flex",alignItems:"center",gap:4,fontSize:10,color:"var(--color-text-tertiary)"}},
        h("span", {style:{width:8,height:8,borderRadius:"50%",border:"2px solid var(--pit-dragon)",display:"inline-block"}}), "foso de Dragón"),
      h("span", {style:{display:"inline-flex",alignItems:"center",gap:4,fontSize:10,color:"var(--color-text-tertiary)"}},
        h("span", {style:{width:8,height:8,borderRadius:"50%",border:"2px solid var(--pit-baron)",display:"inline-block"}}), "foso de Barón")
    ),
    h("div", {className:"muted", style:{fontSize:10,marginTop:3}},
      `ruta azul→ámbar (inicio→fin) · borde verde/rojo = reward · clic para abrir`)
  );
}

// Swimlane timeline: one row per detector, x = match time. Conveys the rhythm
// of the game (clusters = hot moments). Same data as the map.
function MatchTimeline({data, fdet, expId, onSelect, onHover}){
  const decs = data.decisions || [];
  const maxT = Math.max(1, data.duration_s || (decs.length ? Math.max(...decs.map(d=>d.game_time_ms))/1000 : 1));
  const dets = Object.keys(DET).filter(dt => decs.some(d => d.detector===dt));
  const LABEL = 64;
  const ticks = []; for(let s=300; s<maxT; s+=300) ticks.push(s);
  const pct = t => `${Math.min(100, Math.max(0, (t/maxT)*100))}%`;
  const rstroke = rs => rs==null ? "var(--ink-faint)" : (rs>0 ? "var(--color-text-success)" : (rs<0 ? "var(--color-text-danger)" : "var(--ink-faint)"));
  return h("div", {style:{marginBottom:16}},
    h("div", {className:"sec"}, "Línea de tiempo"),
    h("div", {style:{background:"var(--sunken)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:8,padding:"10px 12px"}},
      h("div", {style:{display:"flex",marginBottom:4}},
        h("div", {style:{width:LABEL,flexShrink:0}}),
        h("div", {style:{position:"relative",flex:1,height:12}},
          ...ticks.map(s => h("div", {key:s, style:{position:"absolute",left:pct(s),top:0,transform:"translateX(-50%)",fontSize:9,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}, `${Math.floor(s/60)}:00`))
        )
      ),
      ...dets.map(dt => {
        const det = DET[dt] || {label:dt,acc:"var(--ink-faint)"};
        const rows = decs.filter(d => d.detector===dt);
        const dim = (fdet && fdet!=="all" && dt!==fdet);
        return h("div", {key:dt, style:{display:"flex",alignItems:"center",height:24,opacity:dim?0.2:1}},
          h("div", {style:{width:LABEL,flexShrink:0,fontSize:10,color:det.acc,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}, det.label),
          h("div", {style:{position:"relative",flex:1,height:"100%",borderLeft:"0.5px solid var(--color-border-tertiary)"}},
            ...ticks.map(s => h("div", {key:"g"+s, style:{position:"absolute",left:pct(s),top:0,bottom:0,width:1,background:"var(--color-border-tertiary)",opacity:0.4}})),
            ...rows.map(d => {
              const sel = expId===d.id;
              return h("div", {key:d.id, title:`${det.label} · ${d.time} — ${d.moment}`, onClick:()=>onSelect(d.id), onMouseEnter:()=>onHover&&onHover(d.id),
                style:{position:"absolute",left:pct(d.game_time_ms/1000),top:"50%",transform:"translate(-50%,-50%)",
                  width:sel?16:12,height:sel?16:12,borderRadius:"50%",background:det.acc,
                  border:`2px solid ${sel?"var(--ink)":rstroke(d.reward_score)}`,cursor:"pointer",boxSizing:"border-box"}});
            })
          )
        );
      })
    ),
    h("div", {className:"muted", style:{fontSize:10,marginTop:3}}, "eje = tiempo de partida · color = detector · borde verde/rojo = reward · clic para abrir")
  );
}

// Win-probability curve (proxy: team gold-diff through a logistic). Green above
// 50% = our advantage; objective/tower hitos mark what moved it (power spikes).
const KIND_INI = {dragon:"D", baron_nashor:"B", riftherald:"H", horde:"G", atakhan:"A", tower:"T", inhibitor:"I"};
function WinProbChart({data}){
  const wp = data.winprob || [], evs = data.events || [];
  if(!wp.length) return h("div", {className:"muted", style:{fontSize:11,padding:"8px 0"}}, "Sin datos de oro para esta partida.");
  const W=1000, H=240, maxT=Math.max(1, data.duration_s || (wp[wp.length-1].t_ms/1000));
  const X = ms => Math.min(W, Math.max(0, (ms/1000/maxT)*W));
  const Y = p => (1-p)*H;
  const ticks = []; for(let s=300; s<maxT; s+=300) ticks.push(s);
  const segs = [];
  for(let i=1;i<wp.length;i++){ const a=wp[i-1], b=wp[i]; const up=(a.prob+b.prob)/2>=0.5;
    segs.push(h("line", {key:i, x1:X(a.t_ms),y1:Y(a.prob),x2:X(b.t_ms),y2:Y(b.prob),
      stroke:up?"var(--color-text-success)":"var(--color-text-danger)", strokeWidth:3})); }
  return h("div", {style:{marginBottom:16}},
    h("div", {className:"sec"}, "Ventaja / win-probability (proxy de oro)"),
    h("svg", {viewBox:`0 0 ${W} ${H+24}`, style:{width:"100%",background:"var(--sunken)",borderRadius:8,border:"0.5px solid var(--color-border-tertiary)"}},
      h("line", {x1:0,y1:Y(0.5),x2:W,y2:Y(0.5),stroke:"var(--color-border-secondary)",strokeWidth:1,strokeDasharray:"6 6"}),
      ...ticks.map(s => h("g", {key:"t"+s},
        h("line", {x1:X(s*1000),y1:0,x2:X(s*1000),y2:H,stroke:"var(--color-border-tertiary)",strokeWidth:1,opacity:0.4}),
        h("text", {x:X(s*1000),y:H+16,fill:"var(--color-text-tertiary)",fontSize:12,textAnchor:"middle",fontFamily:"var(--font-mono)"}, `${Math.floor(s/60)}:00`))),
      ...segs,
      h("text", {x:6,y:14,fill:"var(--color-text-tertiary)",fontSize:12}, "100%"),
      h("text", {x:6,y:H-4,fill:"var(--color-text-tertiary)",fontSize:12}, "0%"),
      ...evs.map((e,i) => h("g", {key:"e"+i},
        h("title", null, `${e.kind} ${e.ours?"(nuestro)":"(enemigo)"}`),
        h("circle", {cx:X(e.t_ms),cy:H-9,r:9,fill:e.ours?"var(--color-text-success)":"var(--color-text-danger)",fillOpacity:0.9}),
        h("text", {x:X(e.t_ms),y:H-5,fill:"var(--sunken)",fontSize:11,textAnchor:"middle",fontWeight:700}, KIND_INI[e.kind]||"?")))
    ),
    h("div", {className:"muted", style:{fontSize:10,marginTop:3}}, "verde = ventaja / rojo = desventaja · marcas: objetivos y torres (verde nuestro, rojo enemigo) · D dragón · B barón · H heraldo · T torre · I inhib")
  );
}

// #4 — "Which of my games does this resemble, and are they losses?"
const SIMILAR_DIM_PHRASES = {
  "% muertes": ["más muertes detectadas", "menos muertes detectadas"],
  "% trades": ["más trades detectados", "menos trades detectados"],
  "% tempo": ["más señales de tempo", "menos señales de tempo"],
  "% objetivos": ["más señales de objetivos", "menos señales de objetivos"],
  "EV medio": ["EV medio más alto", "EV medio más bajo"],
  "gap EV medio": ["gap EV medio más alto", "gap EV medio más bajo"],
  "reward medio": ["reward medio más alto", "reward medio más bajo"],
  "fuerza media": ["fuerza media más alta", "fuerza media más baja"],
};
function similarPhrase(shared){ return (SIMILAR_DIM_PHRASES[shared.dim] || [shared.dim+" alto", shared.dim+" bajo"])[shared.high ? 0 : 1]; }

function SimilarMatches({match}){
  const [data, setData] = useState(null);
  useEffect(() => {
    let a = true; setData(null);
    fetch("/api/match_similarity?match=" + encodeURIComponent(match))
      .then(r => r.json()).then(d => { if(a) setData(d); }).catch(()=>{});
    return () => { a = false; };
  }, [match]);
  if(!data) return null;
  const nb = data.neighbors || [];
  if(!nb.length) return null;
  return h("div", {style:{marginTop:14, marginBottom:6}},
    h("div", {className:"sec", style:{display:"flex",gap:8,alignItems:"center"}},
      "Partidas similares",
      data.loss_rate_neighbors!=null && h("span", {style:{fontFamily:"var(--font-mono)",color:data.loss_rate_neighbors>=0.5?"var(--color-text-danger)":"var(--color-text-secondary)"}},
        `${Math.round(data.loss_rate_neighbors*100)}% derrotas`)
    ),
    h("p", {style:{fontSize:11,color:"var(--color-text-tertiary)",margin:"0 0 7px",lineHeight:1.45}}, "Coinciden en el perfil de la partida, no necesariamente en la misma decisión."),
    // Mismo anclaje por retrato que la lista de partidas: sin el, una partida
    // similar solo se distingue por victoria/derrota y una fecha, y no hay forma
    // de saber CUAL es sin abrirla.
    ...nb.map(n => h("div", {key:n.match_id,
      style:{display:"flex",gap:9,alignItems:"flex-start",borderBottom:"1px solid var(--hairline)",padding:"9px 0",marginBottom:2}},
      h("span", {className:"portrait", "aria-hidden":"true", style:{width:30,height:30}},
        n.champion_icon
          ? h("img", {src:n.champion_icon, alt:"", width:30, height:30, loading:"lazy", decoding:"async"})
          : h("span", {className:"portrait-fb"}, (n.champion||"?").slice(0,1))),
      h("div", {style:{flex:1,minWidth:0}},
      h("div", {style:{display:"flex",alignItems:"center",gap:6,marginBottom:n.shared.length?4:0}},
        h("span", {style:{fontSize:"var(--t-xs)",fontWeight:600}}, n.champion),
        n.win!=null && h("span", {title:n.win?"victoria":"derrota", style:{fontSize:"var(--t-micro)",fontWeight:700,color:n.win?"var(--signal-ok)":"var(--signal-bad)"}}, n.win?"V":"D"),
        h("span", {className:"mono", style:{fontSize:"var(--t-micro)",color:"var(--ink-faint)"}}, n.date),
        // "dist 0.69" no dice nada sin conocer la metrica. Se nombra el grado de
        // parecido en palabras y el numero crudo queda en el title, para quien lo
        // quiera auditar. Menor distancia = mas parecida.
        h("span", {className:"chip", style:{marginLeft:"auto"},
          title:`Distancia entre perfiles de partida: ${n.distance} (0 = idéntica)`},
          n.distance<=0.75 ? "muy parecida" : (n.distance<=0.9 ? "parecida" : "algo parecida"))
      ),
      n.shared.length>0 && h("div", {style:{fontSize:"var(--t-micro)",color:"var(--ink-soft)",marginBottom:2}},
        "Coincide en: "+n.shared.map(similarPhrase).join(" · ")))
    ))
  );
}

// Calibrate tab: judge pairs (A vs B) → learn the HEF weights ω from preferences.
function Calibrate(){
  const [pair, setPair] = useState(null);
  const [w, setW] = useState(null);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const [requestState, setRequestState] = useState("idle");
  const loadPair = () => fetch("/api/pair").then(r=>r.json()).then(setPair).catch(()=>{});
  const loadW = () => fetch("/api/weights").then(r=>r.json()).then(setW).catch(()=>{});
  useEffect(() => { loadPair(); loadW(); }, []);
  const judge = (winner) => {
    if(busy || !pair || !pair.pair) return;
    const [a,b] = pair.pair; setBusy(true);
    setRequestState("saving");
    fetch("/api/preference", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({a:a.id,b:b.id,winner,detector:pair.detector,note:note.trim()||null})})
      .then(r=>{ if(!r.ok) throw new Error("preference"); setNote(""); loadPair(); loadW(); setBusy(false); setRequestState("success"); })
      .catch(()=>{ setBusy(false); setRequestState("error"); });
  };
  const apply = () => fetch("/api/weights/apply",{method:"POST"}).then(r=>r.json()).then(()=>location.reload()).catch(()=>{});
  const reset = () => fetch("/api/weights/reset",{method:"POST"}).then(()=>location.reload()).catch(()=>{});

  const DIMS=["power","info","action_fit","wave"];
  const DIM_L={power:"Poder",info:"Info",action_fit:"Acción↔estado",wave:"Oleada"};
  const learned = w && w.learned;
  return h("div", null,
    // weights panel

          h("div",{key:dm+"x",style:{height:6,borderRadius:3,background:"var(--color-background-tertiary)"}},

          h("button",{disabled:busy,onClick:()=>judge("skip"),title:"No comparable o sin contexto — no aporta, no la cuentes para calibrar",style:{...sBadge(false),fontSize:12,padding:"7px 14px",color:"var(--color-text-tertiary)",opacity:0.8}},"No aporta / saltar"),

}

// Cola de revisión: decisiones cuya marca explícita de "opción adecuada"
// contradice (o confirma) a la fórmula action_fit — los mismos casos del
// informe scripts/triage_commit_fit.py, pero con salto directo a la decisión.
function ReviewQueue({queue, onJump, onRefresh, decisions, fbs, onFb, onSave}){
  const [showAgree, setShowAgree] = useState(false);
  const [expId, setExpId] = useState(null);    // caso expandido INLINE (se revisa aquí, sin saltar de pestaña)
  const [clipId, setClipId] = useState(null);
  if(!queue) return h("div",{className:"muted",style:{fontSize:12,padding:"20px 0",textAlign:"center"}},"Cargando…");
  if(!queue.n) return h("div",{className:"muted",style:{fontSize:12,padding:"20px 0",textAlign:"center",lineHeight:1.7}},
    "No hay marcas válidas con fingerprint todavía.", h("br"),
    "Corre scripts/backfill_feedback_fingerprints.py --apply y recarga; o marca opciones adecuadas en decisiones nuevas.");
  const items = (queue.items||[]).filter(x => showAgree || !x.agree);
  const goNext = (id) => {
    const i = items.findIndex(x=>x.id===id);
    const next = items[i+1] || null;
    setExpId(next ? next.id : null); setClipId(null);
    onRefresh && onRefresh();
    if(next) setTimeout(()=>{ const el=document.getElementById("rq-"+next.id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }, 80);
  };
  return h("div", null,
    h("div", {style:{fontSize:12,color:"var(--color-text-secondary)",marginBottom:10,lineHeight:1.6}},
      `Marcaste la opción adecuada en ${queue.n} decisiones válidas; la fórmula (action_fit) te contradice en ${queue.n_disagree}. `,
      "Cada caso es o un defecto de la fórmula o una marca que vale la pena re-juzgar: expándelo aquí mismo, mira el clip, re-marca o anota, y pasa al siguiente."),
    h("div", {style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}},
      h("button", {onClick:()=>setShowAgree(s=>!s), style:{...sBadge(showAgree),fontSize:11,padding:"4px 10px"}},
        showAgree ? "Ocultar las que coinciden" : `Mostrar también las que coinciden (${queue.n - queue.n_disagree})`),
      h("button", {onClick:onRefresh, title:"Recalcula la cola con tu feedback más reciente",
        style:{...sBadge(false),fontSize:11,padding:"4px 10px",border:"0.5px solid var(--color-border-tertiary)"}}, "Refrescar cola")),
    items.length===0 && h("div",{className:"muted",style:{fontSize:12,padding:"16px 0",textAlign:"center"}},"Nada en desacuerdo. La fórmula coincide con todas tus marcas vigentes."),
    ...items.map(x => { const det = DET[x.detector]||{label:x.detector,acc:"var(--ink-faint)"};
      const open = expId===x.id;
      const full = open ? decisions.find(d=>d.id===x.id) : null;
      return h("div", {key:x.id, id:"rq-"+x.id, className:"ticket", "data-open":open?"1":undefined},
        h("button", {onClick:()=>{ setExpId(open?null:x.id); setClipId(null); }, title: open?"Cerrar":"Revisar aquí mismo",
            style:{display:"block",width:"100%",textAlign:"left",
            border:0,borderBottom:"1px solid var(--hairline)",
            background: open ? "var(--surface)" : "transparent", padding:"11px 12px"}},
          h("div", {style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3}},
            h("span", {style:{fontSize:10,fontWeight:600,color:"var(--bg)",background:det.acc,padding:"1px 7px",borderRadius:5}}, det.label),
            h("span", {style:{fontSize:12,fontWeight:500}}, x.moment),
            h("span", {style:{fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",marginLeft:"auto"}}, `${x.time} · ${x.date}`),
            h(Ico,{name:open?"up":"down",size:12,color:"var(--color-text-tertiary)"})),
          h("div", {style:{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",marginBottom:x.note?3:0}},
            `hiciste ${x.taken} (fit ${x.fit_taken==null?"—":x.fit_taken.toFixed(2)}) · marcaste ${x.best} (fit ${x.fit_best==null?"—":x.fit_best.toFixed(2)}) · `,
            h("span",{style:{color:x.agree?"var(--color-text-success)":"var(--color-text-danger)",fontWeight:600}}, x.agree?"fórmula de acuerdo":"fórmula en contra")),
          x.note && h("div", {style:{fontSize:11,color:"var(--color-text-tertiary)"}}, x.note)),
        open && h("div", {className:"row-body", style:{padding:"10px 12px 8px"}},
          full
            ? h(DecisionCard, {key:"rq-card-"+x.id, d:full, exp:true, onToggle:()=>setExpId(null),
                fb:fbs[x.id], onFb, clipOpen:clipId===x.id, onClip:(id)=>setClipId(c=>c===id?null:id), onSave})
            : h("div",{className:"muted",style:{fontSize:12,padding:"8px 0"}},"No encontré la decisión en memoria; recarga la página (F5)."),
          h("div", {style:{display:"flex",gap:10,alignItems:"center",margin:"8px 2px 4px",flexWrap:"wrap"}},
            h("button", {onClick:()=>goNext(x.id), style:{fontSize:12,color:"var(--bg)",background:"var(--color-text-info)",borderRadius:6,padding:"5px 12px",fontWeight:500}}, "Siguiente caso →"),
            h("button", {onClick:()=>onJump(x), style:{fontSize:11,color:"var(--color-text-tertiary)",textDecoration:"underline"}}, "abrir en Decisiones (mapa y partida completa)"),
            h("span", {style:{fontSize:10,color:"var(--color-text-tertiary)",marginLeft:"auto"}}, 'Guarda con "Guardar contexto" dentro de la tarjeta antes de pasar.'))));
    })
  );
}

// Sesion de hoy (#16): 5-6 momentos SIN marcar en mezcla anti-sesgo. Cada card
// salta a su decision (misma mecanica que Revision); al marcar y refrescar,
// salen de la sesion.
const SESSION_BADGE = {
  dominant:  {label:"patrón dominante", color:"var(--det-death)"},
  objective: {label:"objetivo de mayor costo", color:"var(--det-objective)"},
  success:   {label:"acierto difícil", color:"var(--signal-ok)"},
  other:     {label:"variedad", color:"var(--pit-baron)"},
};
function SessionView({data, done, decisions, fbs, onFb, onSave, onJump, onRefresh, onMore}){
  const [expId, setExpId] = useState(null);   // momento expandido INLINE (se revisa aquí, sin saltar de pestaña)
  const [clipId, setClipId] = useState(null);
  if(!data) return h("div", {style:{padding:"40px 0",textAlign:"center",color:"var(--color-text-tertiary)",fontSize:13}}, "Cargando sesión…");
  const t = data.temporal;
  // completada = tocada via los handlers de sesion O con feedback puesto desde
  // cualquier otra pestana (fbs es el estado global de agree/disagree).
  const isDone = (id) => !!done[id] || !!fbs[id];
  const nDone = data.moments.filter(m=>isDone(m.id)).length;
  return h("div", null,
    h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}},
      h("div", {style:{fontSize:12,color:"var(--color-text-tertiary)"}},
        `${data.moments.length} momentos · presupuesto ~20 min · `,
        h("span", {style:{color: nDone===data.moments.length&&nDone>0 ? "var(--signal-ok)" : "var(--color-text-secondary)",fontWeight:600}},
          `${nDone}/${data.moments.length} completados`)),
      h("button", {onClick:onRefresh, title:"Trae una tanda nueva (los momentos ya marcados salen de la cola)",
        style:{...sBadge(false),fontSize:11,padding:"4px 10px"}}, "Nueva sesión")
    ),
    t && h("div", {style:{border:"0.5px solid color-mix(in oklab,var(--signal-bad) 40%,transparent)",background:"color-mix(in oklab,var(--signal-bad) 8%,transparent)",borderRadius:"var(--border-radius-md)",padding:"8px 12px",marginBottom:12,fontSize:12}},
      `${t.count} de tus últimos ${t.last} overextends fueron en min ${t.min_from}-${t.min_to} — ahí vive el hábito ahora mismo.`),
    data.moments.length===0
      ? h("div", {style:{textAlign:"center",color:"var(--color-text-tertiary)",padding:"40px 0",fontSize:13}}, "Nada sin marcar — sesión al día.")
      : data.moments.map((mo,i) => {
          const b = SESSION_BADGE[mo.bucket] || SESSION_BADGE.other;
          const open = expId===mo.id;
          const moDone = isDone(mo.id);
          const full = open ? decisions.find(d=>d.id===mo.id) : null;
          return h("div", {key:mo.id, id:"sv-"+mo.id, className:"ticket", "data-open":open?"1":undefined},
            h("button", {onClick:()=>{ setExpId(open?null:mo.id); setClipId(null); },
              title: open ? "Cerrar" : mo.reason,
              style:{display:"flex",gap:10,alignItems:"center",width:"100%",textAlign:"left",
                border:0,borderBottom:"1px solid var(--hairline)",
                background: open ? "var(--surface)" : "transparent",
                padding:"11px 12px", opacity: moDone && !open ? 0.6 : 1, cursor:"pointer"}},
              h("div", {style:{fontSize:15,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",width:18,flexShrink:0}}, String(i+1)),
              h("div", {style:{flex:1,minWidth:0}},
                h("div", {style:{display:"flex",alignItems:"center",gap:6,marginBottom:3,minWidth:0}},
                  h(DetIcon, {detector:mo.detector, size:13, color:(DET[mo.detector]||{}).acc}),
                  h("span", {style:{fontSize:"var(--t-xs)",fontWeight:600,color:"var(--ink)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}, mo.moment || mo.detector)),
                h(RowMeta, {champion:mo.champion, date:mo.date, time:mo.time, evGap:mo.ev_gap})
              ),
              moDone && h("span", {style:{fontSize:10,padding:"3px 8px",borderRadius:"var(--border-radius-md)",border:"0.5px solid color-mix(in oklab,var(--signal-ok) 40%,transparent)",background:"color-mix(in oklab,var(--signal-ok) 12%,transparent)",color:"var(--signal-ok)",whiteSpace:"nowrap",flexShrink:0}}, "completada"),
              h("span", {style:{fontSize:10,padding:"3px 8px",borderRadius:"var(--border-radius-md)",border:`0.5px solid ${tonedBorder(b.color)}`,background:tint(b.color,8),color:b.color,whiteSpace:"nowrap",flexShrink:0}}, b.label),
              h(Ico,{name:open?"up":"down",size:12,color:"var(--color-text-tertiary)"})
            ),
            open && h("div", {className:"row-body", style:{padding:"10px 12px 8px"}},
              full
                ? h(DecisionCard, {key:"sv-card-"+mo.id, d:full, exp:true, onToggle:()=>setExpId(null),
                    fb:fbs[mo.id], onFb, clipOpen:clipId===mo.id, onClip:(id)=>setClipId(c=>c===id?null:id), onSave})
                : h("div",{className:"muted",style:{fontSize:12,padding:"8px 0"}},"No encontré la decisión en memoria; recarga la página (F5)."),
              h("div", {style:{display:"flex",gap:10,alignItems:"center",margin:"8px 2px 4px",flexWrap:"wrap"}},
                h("button", {onClick:()=>onJump({id:mo.id, match:mo.match, cohort:mo.cohort, t_ms:(mo.moment_ms!=null?mo.moment_ms:mo.game_time_ms)}), style:{fontSize:11,color:"var(--color-text-tertiary)",textDecoration:"underline"}}, "abrir en Decisiones (mapa y partida completa)"),
                h("span", {style:{fontSize:10,color:"var(--color-text-tertiary)",marginLeft:"auto"}}, 'Marca o guarda contexto en la tarjeta: queda "completada"; abajo, "Traer nuevas" la cambia por otra.'))
            )
          );
        }),
    data.moments.length>0 && (
      nDone>0
        ? h("div", {style:{textAlign:"center",margin:"14px 0 4px"}},
            h("button", {onClick:onMore, title:"Cambia las completadas por momentos nuevos; deja las que aún no marcaste",
              style:{...sBadge(false),fontSize:12,padding:"7px 18px",border:"0.5px solid var(--color-border-tertiary)"}},
              `Traer ${nDone} nueva${nDone===1?"":"s"} (reemplaza completadas)`))
        : (data.exhausted
            ? h("div", {style:{textAlign:"center",margin:"14px 0 4px",fontSize:12,color:"var(--color-text-tertiary)"}}, "No quedan más momentos sin marcar en la cola.")
            : null))
  );
}

// Cola de trades por informatividad (#5): trades PERDIDOS sin marcar, ordenados
// por Fisher x cobertura (backend /api/trade_queue). Cada momento YA es la
// decision enriquecida, asi que la card se pinta directo (no depende del filtro
// de cohorte global). Misma mecanica inline que Sesion de hoy: marcar -> verde.
// El server excluye las ya marcadas, asi que "Actualizar cola" las quita y re-ordena.
const TRADE_ACCENT = "var(--det-trade)";
function TradeQueueView({data, done, fbs, onFb, onSave, onJump, onRefresh}){
  const [expId, setExpId] = useState(null);
  const [clipId, setClipId] = useState(null);
  // Tandas de 10: la lista completa de una abruma (feedback 2026-07-18); el
  // "Mostrar mas" trae la siguiente tanda cuando el jugador quiere seguir.
  const [limit, setLimit] = useState(10);
  if(!data) return h("div", {style:{padding:"40px 0",textAlign:"center",color:"var(--color-text-tertiary)",fontSize:13}}, "Cargando cola de trades…");
  const isDone = (id) => !!done[id] || !!fbs[id];
  const total = data.total!=null ? data.total : data.moments.length;
  const nDone = data.moments.filter(m=>isDone(m.id)).length;
  const shown = data.moments.slice(0, limit);
  return h("div", null,
    h("div", {style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}},
      h("div", {style:{fontSize:12,color:"var(--color-text-tertiary)"}},
        `${total} trades perdidos sin marcar · `,
        h("span", {style:{color: nDone>0 ? "var(--signal-ok)" : "var(--color-text-secondary)",fontWeight:600}},
          `${nDone} marcado${nDone===1?"":"s"} en esta tanda`)),
      h("button", {onClick:onRefresh, title:"Quita de la cola las que marcaste y re-ordena el resto por informatividad",
        style:{...sBadge(false),fontSize:11,padding:"4px 10px"}}, "Actualizar cola")
    ),
    h("div", {style:{border:"0.5px solid color-mix(in oklab,var(--det-trade) 40%,transparent)",background:"color-mix(in oklab,var(--det-trade) 8%,transparent)",borderRadius:"var(--border-radius-md)",padding:"8px 12px",marginBottom:12,fontSize:12,lineHeight:1.5}},
      "Orden = informatividad para el learner: cobertura por campeón × fase × banda de oro (en trade_v1 el Fisher es casi plano, así que domina la cobertura). ",
      h("b", null, "Marca de arriba hacia abajo"),
      " — cada marca cae donde más le enseña al BT y donde menos se apelotona. El criterio: cambiar daño solo con ventana (maná/cooldowns/posición); si no, respetar y farmear."),
    data.moments.length===0
      ? h("div", {style:{textAlign:"center",color:"var(--color-text-tertiary)",padding:"40px 0",fontSize:13}}, "No quedan trades sin marcar — campaña al día.")
      : shown.map((mo,i) => {
          const open = expId===mo.id;
          const moDone = isDone(mo.id);
          const bucket = mo.rank_why ? (mo.rank_why.split("·")[1]||"").trim() : "trade";
          return h("div", {key:mo.id, id:"tq-"+mo.id, className:"ticket", "data-open":open?"1":undefined},
            h("button", {onClick:()=>{ setExpId(open?null:mo.id); setClipId(null); },
              title: open ? "Cerrar" : (mo.rank_why||""),
              style:{display:"flex",gap:10,alignItems:"center",width:"100%",textAlign:"left",
                border:0,borderBottom:"1px solid var(--hairline)",
                background: open ? "var(--surface)" : "transparent",
                padding:"11px 12px", opacity: moDone && !open ? 0.6 : 1, cursor:"pointer"}},
              h("div", {style:{fontSize:15,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",width:22,flexShrink:0}}, String(i+1)),
              h("div", {style:{flex:1,minWidth:0}},
                h("div", {style:{display:"flex",alignItems:"center",gap:6,marginBottom:3,minWidth:0}},
                  h(DetIcon, {detector:"trade_v1", size:13, color:DET.trade_v1.acc}),
                  h("span", {style:{fontSize:"var(--t-xs)",fontWeight:600,color:"var(--ink)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}, mo.moment || "Trade perdido sin marcar")),
                h(RowMeta, {champion:mo.champion, date:mo.date, time:mo.time, evGap:mo.ev_gap})
              ),
              moDone && h("span", {style:{fontSize:10,padding:"3px 8px",borderRadius:"var(--border-radius-md)",border:"0.5px solid color-mix(in oklab,var(--signal-ok) 40%,transparent)",background:"color-mix(in oklab,var(--signal-ok) 12%,transparent)",color:"var(--signal-ok)",whiteSpace:"nowrap",flexShrink:0}}, "completada"),
              h("span", {style:{fontSize:10,padding:"3px 8px",borderRadius:"var(--border-radius-md)",border:`0.5px solid ${tonedBorder(TRADE_ACCENT)}`,background:tint(TRADE_ACCENT,8),color:TRADE_ACCENT,whiteSpace:"nowrap",flexShrink:0,fontFamily:"var(--font-mono)"}}, bucket),
              h(Ico,{name:open?"up":"down",size:12,color:"var(--color-text-tertiary)"})
            ),
            open && h("div", {className:"row-body", style:{padding:"10px 12px 8px"}},
              h(DecisionCard, {key:"tq-card-"+mo.id, d:mo, exp:true, onToggle:()=>setExpId(null),

// Exposicion sin muerte (#17 Fase 1, REPORT-ONLY): estados en los que estabas
// profundo y a ciegas SIN que te castigaran con muerte. death_v1 solo ve los que
// terminan en muerte, asi que la fraccion SOBREVIVIDA es la senal nueva. Sin
// marcado: esta fase existe para juzgar la tasa de falsos positivos a mano.
const EXPOSURE_ACCENT = "var(--pit-dragon)";
const EXPOSURE_MIN_MIAS = 2;      // refleja exposure.MIN_ENEMIES_UNSEEN
const EXPOSURE_MAX_SR = 0.35;     // refleja exposure.MAX_SAFETY_RATIO
function ExposureCard({data, onJump}){

    h("div", {style:{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}},
      h("div", {style:{fontSize:13,fontWeight:600}}, "Exposición sin muerte"),
      h("span", {style:{fontSize:10,padding:"2px 8px",borderRadius:"var(--border-radius-md)",border:"0.5px solid color-mix(in oklab,var(--signal-bad) 40%,transparent)",background:"color-mix(in oklab,var(--signal-bad) 14%,transparent)",color:"var(--signal-bad)"}}, "criterio NO validado")
    ),
    // Validado contra las 54 muertes que el jugador etiqueto (2026-07-22):
    // recall 3%, AUC 0.477, p=0.725. El criterio mide profundidad en mapa; su
    // "exposicion" pasa en su propia mitad (mediana safety_ratio 0.79). La
    // tarjeta se queda como registro, pero NO puede presentar sus numeros como
    // si midieran exposicion en su sentido.
    h("div", {style:{border:"0.5px solid color-mix(in oklab,var(--signal-bad) 40%,transparent)",background:"color-mix(in oklab,var(--signal-bad) 7%,transparent)",borderRadius:"var(--border-radius-md)",padding:"8px 10px",marginBottom:10,fontSize:11,lineHeight:1.6}},
      h("b", null, "Este criterio no detecta lo que tú llamas exposición."),
      " Medido contra tus 54 muertes etiquetadas: recall 3%, AUC 0.477, p=0.725 (azar). ",
      "En tus muertes de exposición estabas en tu PROPIA mitad (mediana de profundidad 0.79); ",
      "el criterio mide qué tan metido estás en campo enemigo. Los números de abajo describen ",

    h("div", {style:{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.6,marginBottom:10}},
      h("b", null, `${a.n} episodios`), ` (${a.per_match} por partida) que cumplen el criterio actual: `,
      `profundidad <= ${EXPOSURE_MAX_SR} y ${EXPOSURE_MIN_MIAS}+ enemigos sin ver. `,
      `${a.pct_survived}% sobrevivió, ${a.n_died} terminó en muerte.`,
      a.n_frames!=null && h("span", {style:{color:"var(--color-text-tertiary)"}},
        ` (${a.n_frames} frames-minuto crudos, ${a.frames_per_episode} por episodio: se cuenta el episodio, no el minuto, para no inflar el N).`)),
    h("div", {style:{display:"flex",gap:16,flexWrap:"wrap",fontSize:11,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",marginBottom:8}},
      h("div", null, "fase: " + dist(a.by_phase).map(([k,v])=>`${k} ${v}`).join(" · ")),
      h("div", null, "oro: " + dist(a.by_gold_band).map(([k,v])=>`${k} ${v}`).join(" · ")),
      h("div", null, "campeón: " + dist(a.by_champion).slice(0,4).map(([k,v])=>`${k} ${v}`).join(" · "))
    ),
    h("button", {onClick:()=>setOpen(o=>!o), style:{fontSize:11,color:"var(--color-text-tertiary)",textDecoration:"underline"}},
      open ? "ocultar momentos" : `ver los ${data.shown} más severos (para juzgar falsos positivos)`),
    open && h("div", {style:{marginTop:10,overflowX:"auto"}},
      h("table", {style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
        h("thead", null, h("tr", {style:{color:"var(--color-text-tertiary)",textAlign:"left"}},
          ...["campeón · fecha","min","dura","fase/oro","profundidad","MIAs","¿murió?","clip",""].map(x =>
            h("th", {key:x, style:{padding:"4px 6px",borderBottom:"0.5px solid var(--color-border-tertiary)",fontWeight:400}}, x)))),
        h("tbody", null, ...data.moments.map((m,i) =>
          h("tr", {key:i, style:{borderBottom:"0.5px solid var(--color-border-tertiary)"}},

            h("td", {style:{padding:"4px 6px",fontFamily:"var(--font-mono)"}}, String(m.enemies_unseen)),

            h("td", {style:{padding:"4px 6px"}},
              onJump && h("button", {onClick:()=>onJump({id:null, match:m.match, cohort:m.cohort, t_ms:m.game_time_ms}),

          )))

        "Report-only: no se marca ni se persiste nada. Si una fila NO te parece exposición real, es un falso positivo — con eso se calibran los umbrales antes de promover el detector.")
    )
